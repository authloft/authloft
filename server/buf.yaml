version: v2
modules:
  # .proto 源根目录：包名 api.<域> 对应目录 api/<域>/（docs/后端架构.md §2）
  - path: proto
lint:
  use:
    - STANDARD
    # 自定义规则：拦截 .proto 中的 32 位整型字段（docs/后端架构.md §1.6 行 89
    # 「buf lint 加自定义规则拦 int32/uint32/fixed32」；docs/接口文档.md §12.9
    # 「整型一律 int64」）。实现见 tools/bufcheck。
    - PLUGIN_FIELD_NO_32BIT_INT
  except:
    # 接口文档.md §12.9 规定包名为 api.<域>（如 api.common），不带版本后缀；
    # 该规则与本项目包名约定冲突，按文档优先豁免。
    - PACKAGE_VERSION_SUFFIX
    # 接口文档.md §1.3 行 104 定稿：SsoService 登录流程五方法
    # （LoginDefault/Register/ResetPassword/LoginOauth/GetLoginTicket）共用同一响应消息
    # LoginFlowResponse，§2.7.4/§2.8 的写入应答亦复用既有消息，响应名不随方法名
    # （§12.9 行 1747「请求 XxxRequest、响应 XxxResponse」）、亦不每方法独建，
    # 两条响应侧规则与文档冲突，按「文档优先于代码」豁免；
    # 请求侧命名规则（RPC_REQUEST_STANDARD_NAME）不豁免。
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  # AdminService/CreateProvider、UpdateProvider 的请求体是 §5.3 行 1180
  # 「提交体即 {"<key>": <value>}」的动态键集合（key = provider 表列名或 Ext 字段名，
  # 随 type 演进），以 google.protobuf.Struct 平铺承载、不包装 Request；
  # RPC_REQUEST_STANDARD_NAME（请求消息名须为方法名 + Request）与平铺定稿结构性冲突
  #（WKT Struct 无法更名，固定消息无法建模开放键集），按「文档优先于代码」仅对
  # 该 service 定义文件豁免本条（既有 scoped except 先例；
  # 其余文件与 rpc/setup 域的请求命名仍受该规则约束）。
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - proto/api/admin/v1/admin.proto
    # 存储模型：接口文档 §12.1/§12.2 定稿的 ext port/presign_ttl、
    # meta totp_digits/totp_period 为 int32 字段；后端架构 §1.6 行 89 的拦截
    # 针对接口层整型口径（接口文档 §12.9「整型一律 int64」），存储模型按
    # 「文档优先于代码」豁免（沿用既有豁免先例）。
    # 仅 scope 存储模型三目录，proto/api/** 仍受本规则约束。
    PLUGIN_FIELD_NO_32BIT_INT:
      - proto/provider
      - proto/credential
      - proto/client
plugins:
  # 自定义 check 插件（官方插件机制，buf.build/go/bufplugin SDK）。
  # 插件是独立 Go module（tools/bufcheck/go.mod），不污染 server 主模块依赖。
  - plugin: [go, -C, ./tools/bufcheck, run, .]
