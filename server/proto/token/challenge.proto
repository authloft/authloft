syntax = "proto3";

package token;

// 本包是服务端内部令牌载荷（docs/后端架构.md §11.6）：由服务端签发、
// 服务端解析，前端只当不透明串透传，用裸包名 token（docs/CODE_GUIDE.md §3.6
// 存储模型口径）。生成到 gen/go/token/，Go 包名 token；整型一律 int64。
option go_package = "authloft/gen/go/token;token";

// ChallengeTokenPayload 是进行中的一次性挑战载荷（docs/后端架构.md §11.6.7）。
// 复用 §11.6.1 封装与加解密实现；AAD purpose 只取 webauthn（webauthn_enroll
// 场景，密钥 sign_key.webauthn）或 verification（step-up 挑战，密钥
// sign_key.verification），与 sign_key.login 互不解。AAD purpose 不进载荷，
// 载荷内业务用途统一叫 biz_purpose，两套取值各自封闭、解出后分别断言。
message ChallengeTokenPayload {
  // 业务用途，封闭集合：login / mfa / bind_contact / change_password /
  // unbind_totp / unbind_thirdparty / admin_sensitive / webauthn_enroll。
  string biz_purpose = 1;
  // 主体类型：tid | uid。
  string subject_kind = 2;
  // 主体标识，对应 tid 或 uid。
  string subject = 3;
  // WebAuthn challenge / 本轮挑战 nonce。
  string nonce = 4;
  // 更细动作，如 webauthn_register；消费方按 biz_purpose + operation 双重校验。
  string operation = 5;
  // step-up 允许的因子快照；webauthn 注册为空。
  repeated string methods = 6;
  // 签发时间，Unix 秒。
  int64 iat = 7;
  // 过期时间，Unix 秒；挑战有效期：webauthn_enroll 120s，step-up 300s。
  int64 exp = 8;
}