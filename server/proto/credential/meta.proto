syntax = "proto3";

package credential;

// 本包是存储模型（docs/接口文档.md §12 前言行 1606：credential.Meta 前端管理
// 后台按字段渲染，契约在接口文档 §12.2，双端不得各自手写）。裸包名 credential
// 不带 .v1 版本后缀，系存储模型惯例（与 token 包同构）。生成到
// gen/go/credential/，Go 包名 credential。存储模型豁免 32 位整型 lint
// （bufcheck 仅拦 proto/api/**）：totp_digits / totp_period 的 int32 系
// §12.2 行 1715-1716 文档定稿，照文档逐字沿用。
option go_package = "authloft/gen/go/credential;credential";

// CredentialMeta 是凭证扩展元数据（docs/接口文档.md §12.2 行 1698-1718），
// 对应 user_credential.meta 列（VARBINARY，§12.0 行 1627：结构固定走 Protobuf），
// 按 kind 使用其中一段。消息名以文档行 1703 `message CredentialMeta` 为准。
// 字段名 / 编号 / 类型 / 注释与行 1703-1717 的 protobuf 定义逐字一致。
message CredentialMeta {
  // kind=webauthn
  repeated string transports  = 1;  // internal|hybrid|usb|nfc|ble
  string attestation_type     = 2;  // none|basic|attca
  string aaguid               = 3;
  bool   backup_eligible      = 4;
  bool   backup_state         = 5;

  // kind=recovery_code
  repeated string recovery_codes = 10;  // 10 个恢复码明文（8 位 Crockford Base32 小写，展示形如 xxxx-xxxx）

  // kind=totp
  int32 totp_digits = 20;   // 默认 6
  int32 totp_period = 21;   // 默认 30
}
