syntax = "proto3";

package api.oidc;

// Go 包名沿用 api.common.v1 / api.sso.v1 / api.account.v1 的写法：
// 目录 api/oidc 对应包名 api.oidc（docs/接口文档.md §12.9「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/oidc;api";

// UserinfoResponse 是 `GET /api/oidc/userinfo` 的响应（§4.5）：
// OIDC 标准 Claims，按 RFC 格式平铺、豁免 §1.0 统一信封（§1.0），
// 顶层无 status 字段，本消息即完整响应体。
// 字段名与 Claims 表及 JSON 示例逐字一致（§12.9）；
// Claim 语义在 §4.5 唯一定义，取值来源映射见《后端架构》§14.4。
message UserinfoResponse {
  // 用户 ID（user.id）；整型一律 int64，JSON 输出十进制字符串，
  // 与示例 "10086" 一致（§12.9、§1.12）。
  int64 sub = 1;
  // 昵称（user.nickname）。
  string name = 2;
  // 邮箱（user.email）；默认掩码，仅当 Access Token 的 scope 含
  // email_plain 时明文，掩码矩阵见 §3.1、807-809。
  string email = 3;
  // 邮箱验证状态，取库内 email_verified 标志；JSON 为 true/false，
  // 不受掩码影响。
  bool email_verified = 4;
  // 手机号（user.phone）；默认掩码，仅当 scope 含 phone_plain 时明文，
  // 掩码矩阵见 §3.1、807-809。
  string phone_number = 5;
  // 手机号验证状态，取库内 phone_verified 标志；JSON 为 true/false，
  // 不受掩码影响。
  bool phone_number_verified = 6;
  // 头像 URL（user.avatar_url）。
  string picture = 7;
  // 登录链路中实际通过的认证方法数组，如 ["pwd","otp"]。
  repeated string amr = 8;
}

// `GET /api/oidc/get_user_info`（§4.6，Authloft 格式）按 §1.0 统一信封
// 返回 §3.1 的 Authloft 用户信息字段：成功平铺 + status:"success" 由 codec 注入
//（数据消息顶层禁用 status 字段）。其字段集合与
// `GET /api/rpc/account/{uid}/profile` 逐字相同（§3.1「共用同一字段集合」、
// 《后端架构》§14.4「共用同一结构」），按「同一结构只定义一次」口径
//（既定口径，先例 api/sso/v1/login.proto「响应复用、不另建消息」），
// 跨包复用 api.rpc.v1.ProfileResponse（api/rpc/v1/profile.proto），本包不重复定义；
// 掩码口径差异（get_user_info 默认掩码、scope 含 phone_plain / email_plain 才明文，
// §3.1；rpc 明文）由服务端取值决定，不构成结构差异。
