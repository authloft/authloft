syntax = "proto3";

package api.rpc.v1;

// profile 嵌套结构复用 account 域既有消息（§3.1 / §3.2 同源，「同一结构只定义一次」，
// 既定口径）；跨包引用先例见 api/admin/v1/user.proto 引用 api/account/v1/mfa.proto。
// account 域 import 已随迁到 v1；rpc 域自身升
// api.rpc.v1 后该 import 路径继续有效。
import "api/account/v1/profile.proto";

// 包名 api.rpc.v1（docs/接口文档.md §12.9 行 1747「包名 api.<域>.v1」），
// 目录 api/rpc/v1 与包名逐段一致（buf STANDARD PACKAGE_DIRECTORY_MATCH）。
// Go 产物：authloft/gen/go/api/rpc/v1（包名 rpcv1）；connect 侧产物由
// protoc-gen-connect-go 按同包 user.proto 的 UserService 定义生成（buf.gen.yaml）。
option go_package = "authloft/gen/go/api/rpc/v1;rpcv1";

// ProfileResponse 是 UserService/GetUserProfile 的响应（§7 行 1387）：
// §3.1 行 773-795 的 Authloft 用户信息结构；本域响应遵循 §1.0 成功响应即消息
// 本身（§7 行 1380，Connect 化后无 status:"success" 信封——旧信封形态已随 codec 删除）。
// 不跨包引用 api.account.v1.ProfileResponse：两者同构（AdminUser 与本消息
// 两度先例），account 侧改名落地后是否合并另行定夺。
// 本消息亦承载 `GET /api/oidc/get_user_info` 的响应结构（§4.6 行 1122-1124、
// 《后端架构》§14.4 行 1618「共用同一结构」；见 api/oidc/userinfo.proto 尾注，不重复定义）。
// 字段名与 §3.1 JSON 示例逐字一致（§12.9 行 1749）；整型一律 int64（行 1751）。
// 掩码口径：rpc 域 phone / email 明文（§3.1 掩码矩阵行 805，已由 X-Signature 鉴权）；
// oidc 侧默认掩码（行 803），差异由服务端取值决定，不构成结构差异。
message ProfileResponse {
  // 用户 ID（§3.1 行 776）。
  int64 id = 1;
  // 登录名（§3.1 行 777）。
  string username = 2;
  // 昵称（§3.1 行 778）。
  string nickname = 3;
  // 头像地址（§3.1 行 779）。
  string avatar_url = 4;
  // 手机号；rpc 域明文（§3.1 行 780、行 805）。
  string phone = 5;
  // 手机号是否已验证，JSON 为 1/0（§3.1 行 781）。
  int64 phone_verified = 6;
  // 邮箱；rpc 域明文（§3.1 行 782、行 805）。
  string email = 7;
  // 邮箱是否已验证，JSON 为 1/0（§3.1 行 783）。
  int64 email_verified = 8;
  // 账号状态：1 正常 0 禁用（§3.1 行 784）；信封顶层 status 为保留字（§1.0），
  // 业务字段用 user_status（同 §3.1 行 784 口径）。
  int64 user_status = 9;
  // 系统强制启用两步验证（§3.1 行 785）。
  int64 mfa_required = 10;
  // 安全版本号，便于调用方感知会话失效（§3.1 行 786）。
  int64 epoch = 11;
  // 最后登录时间，Unix 秒（§3.1 行 787）。
  int64 last_login_at = 12;
  // 创建时间，Unix 秒（§3.1 行 788）。
  int64 created_at = 13;
  // 更新时间，Unix 秒（§3.1 行 789）。
  int64 updated_at = 14;
  // user_profile 表结构（§3.1 行 790-794）；跨包引用 account 域既有消息
  //（api/account/v1/profile.proto 的 UserProfile，§3.1 / §3.2 同源）。
  api.account.v1.UserProfile profile = 15;
}

// GetUserProfileRequest 是 UserService/GetUserProfile 的请求（§7 行 1387 `{uid}`）。
// Connect 化把原 REST 路径参数 {uid} 转为请求字段（Connect 无路径参数）。
message GetUserProfileRequest {
  // 目标用户 ID（§7 行 1384）。
  int64 uid = 1;
}

// UpdateUserProfileRequest 是 UserService/UpdateUserProfile 的请求（§7 行 1388
// `{uid, …}`，入参同 §3.2 的 AccountService/UpdateProfile）：uid 承载原路径参数，
// 其余字段与 api.account.v1.UpdateProfileRequest 同源（§3.2 行 820：nickname /
// avatar_url / profile 三项，用户名 / 手机号 / 邮箱不可由此修改）；嵌套 profile
// 结构跨包复用 api.account.v1.UserProfile（同一结构只定义一次，§12.9 行 1748）。
message UpdateUserProfileRequest {
  // 目标用户 ID（§7 行 1385）。
  int64 uid = 1;
  // 昵称，可选（§3.2 行 820）。
  string nickname = 2;
  // 头像地址，可选（§3.2 行 820）。
  string avatar_url = 3;
  // 用户资料，可选（§3.2 行 820，字段见 §3.1 行 793-797）。
  api.account.v1.UserProfile profile = 4;
}

// OkResponse 是 UserService/UpdateUserProfile 的空应答：§7 行 1388 仅约束入参，
// 出参沿用同端点 §3.2 行 820 的口径「成功为空响应」——空消息 protojson 输出 {}
//（§1.0 行 57「成功响应即 RPC 响应消息」；先例 api/account/v1/profile.proto 的
// 空 OkResponse，共用响应依赖 buf RPC_RESPONSE_STANDARD_NAME / RPC_REQUEST_RESPONSE_UNIQUE
// 豁免，buf.yaml except，沿用既有豁免）。
message OkResponse {}
