syntax = "proto3";

package api.rpc.v1;

// 接口文档 §12.9：rpc 域例外——同包 api.rpc.v1 内拆
// 两个 service（UserService 资料读写 / TokenService 会话解码，§7），
// 取代原单一 service 定义。方法的 input/output 消息定义在同包
// profile.proto，编号零漂移（拆分不变更任何消息）。
import "api/rpc/v1/profile.proto";

// 包名 api.rpc.v1（docs/接口文档.md §12.9）；Go 产物
// authloft/gen/go/api/rpc/v1（rpcv1），connect 产物（protoc-gen-connect-go）
// 随本 service 定义生成（buf.gen.yaml）。
option go_package = "authloft/gen/go/api/rpc/v1;rpcv1";

// DecodeOidcSubRequest 是 UserService/DecodeOidcSub 的请求（接口文档 §7.3）：
// sub 为按客户端派生的 pairwise 密文（§4.5、后端架构 §11.6.8）。
message DecodeOidcSubRequest {
  // 待还原的密文 sub。
  string sub = 1;
}

// DecodeOidcSubResponse 是 UserService/DecodeOidcSub 的响应（§7.3）：
// uid 按 §1.12 以十进制字符串输出，client_id 为该 sub 的签发客户端。
message DecodeOidcSubResponse {
  // 还原出的真实用户 ID。
  int64 uid = 1;
  // sub 内携带的签发客户端 ID。
  string client_id = 2;
}

// UserService 是 rpc 域的资料读写 service（docs/接口文档.md §7）。
// Connect 路径 = /api.rpc.v1.UserService/<Method>（签名串 path 段取值，§7）；
// 方法清单与 §7 逐一对应：
//   GetUserProfile      §7（读接口：Get 前缀，不去重）
//   UpdateUserProfile   §7（写接口：Update 前缀，nonce 去重）
//   GetUserProfiles     §7.2（读接口：批量读资料，定稿，不校验 nonce）
//   DecodeOidcSub       §7.3（读接口：sub 解码，不触 DB，校验 X-Client-ID）
// 鉴权（写接口 nonce 去重 → 五项签名；读接口仅五项签名，校验顺序 §7）
// 为 Connect interceptor（后端 §3.14 interceptors.go 按「命名决定校验」分流，
// §7），装配必须经 internal/connect 的 RegisterRPC（强制包
// CaptureRawBody——§7 body 段取原始请求体字节，漏挂 fail-closed）；
// session 步归端点自身（§7）。本实现只定契约，业务 handler 留待后续实现。
service UserService {
  // 读用户资料，响应为 §3.1 的 Authloft 结构（§7）。
  rpc GetUserProfile(GetUserProfileRequest) returns (ProfileResponse);
  // 改资料，入参同 §3.2 的 AccountService/UpdateProfile，成功为空响应（§7）。
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (OkResponse);
  // 批量读用户资料（接口文档 §7.2）：响应条目与 GetUserProfile 同构，
  // 请求/响应消息定义在同包 profile.proto（GetUserProfilesRequest /
  // GetUserProfilesResponse，§7.2 proto 变更条款）。读接口不校验 nonce：
  // 方法名不含 Update / Delete / Set / Create / Revoke 任一前缀，按 §7 前言
  // 命名决定校验归读接口——nonce 参与签名但不去重，允许重复请求、可安全重试
  //（§7.2 命名分流口径）。
  rpc GetUserProfiles(GetUserProfilesRequest) returns (GetUserProfilesResponse);
  // OIDC sub 解码（接口文档 §7.3）：读接口（签名 → session，nonce 不去重）；
  // Open 还原 + 校验 client_id == X-Client-ID（跨客户端拒绝），不触 DB。
  rpc DecodeOidcSub(DecodeOidcSubRequest) returns (DecodeOidcSubResponse);
}
