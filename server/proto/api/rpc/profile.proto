syntax = "proto3";

package api.rpc;

// profile 嵌套结构复用 account 域既有消息（§3.1 / §3.2 同源，「同一结构只定义一次」，
// 既定口径）；跨包引用先例见 api/admin/user.proto 行 7 引用 api/account/mfa.proto。
import "api/account/profile.proto";

// Go 包名沿用 api.common / api.sso / api.account 的写法：
// 目录 api/rpc 对应包名 api.rpc（docs/接口文档.md §12.9 行 1746「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/rpc;api";

// ProfileResponse 是 `GET /api/rpc/account/{uid}/profile` 的响应（§7 行 1383）：
// §3.1 行 773-795 的 Authloft 用户信息结构；本域响应遵循 §1.0 统一信封
//（§7 行 1379），status:"success" 由 codec 注入，数据消息顶层禁用 status 字段。
// 不跨包引用 api.account.ProfileResponse：其存量字段 status=9 为待 account 域改名的
// 历史遗留，引用会把信封保留字 status 业务字段带入报文；先例 api/admin/user.proto
// 的 AdminUser 同口径独立定义，待其改名后如需切换为复用，另行定夺。
// 本消息亦承载 `GET /api/oidc/get_user_info` 的响应结构（§4.6 行 1122-1124、
// 《后端架构》§14.4 行 1618「共用同一结构」；见 api/oidc/userinfo.proto 尾注，不重复定义）。
// 字段名与 §3.1 JSON 示例逐字一致（§12.9 行 1748）；整型一律 int64（行 1750）。
// 掩码口径：rpc 域 phone / email 明文（§3.1 掩码矩阵行 805，已由 X-Signature 鉴权）；
// oidc 侧默认掩码（行 803），差异由服务端取值决定，不构成结构差异。
message ProfileResponse {
  // 用户 ID（§3.1 行 776）。
  int64 id = 1;
  // 登录名（§3.1 行 777）。
  string username = 2;
  // 昵称（§3.1 行 778）。
  string nickname = 3;
  // 头像地址（§3.1 行 779）。
  string avatar_url = 4;
  // 手机号；rpc 域明文（§3.1 行 780、行 805）。
  string phone = 5;
  // 手机号是否已验证，JSON 为 1/0（§3.1 行 781）。
  int64 phone_verified = 6;
  // 邮箱；rpc 域明文（§3.1 行 782、行 805）。
  string email = 7;
  // 邮箱是否已验证，JSON 为 1/0（§3.1 行 783）。
  int64 email_verified = 8;
  // 账号状态：1 正常 0 禁用（§3.1 行 784）；信封顶层 status 为保留字（§1.0），
  // 业务字段用 user_status（同 §3.1 行 784、先例 AdminUser 口径）。
  int64 user_status = 9;
  // 系统强制启用两步验证（§3.1 行 785）。
  int64 mfa_required = 10;
  // 安全版本号，便于调用方感知会话失效（§3.1 行 786）。
  int64 epoch = 11;
  // 最后登录时间，Unix 秒（§3.1 行 787）。
  int64 last_login_at = 12;
  // 创建时间，Unix 秒（§3.1 行 788）。
  int64 created_at = 13;
  // 更新时间，Unix 秒（§3.1 行 789）。
  int64 updated_at = 14;
  // user_profile 表结构（§3.1 行 790-794）；跨包引用 account 域既有消息
  //（api/account/profile.proto 的 UserProfile，§3.1 / §3.2 同源）。
  api.account.UserProfile profile = 15;
}

// `POST /api/rpc/account/{uid}/profile`（§7 行 1384「入参同 §3.2 的
// POST /api/account/profile」）复用 api.account.UpdateProfileRequest
//（api/account/profile.proto，§3.2 行 817），不重复定义。

// OkResponse 是 `POST /api/rpc/account/{uid}/profile` 的空应答：§7 行 1384 仅约束入参，
// 出参沿用同端点 §3.2 行 817 的口径「无数据字段（仅 status）」——经 codec WriteSuccess
// 输出 {"status":"success"}（无数据字段的写端点成功即纯信封；先例
// api/admin/admin.proto 的空 OkResponse；数据消息顶层禁用 status）。
message OkResponse {}
