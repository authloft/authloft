syntax = "proto3";

package api.admin;

// Go 包名沿用 api.common / api.sso / api.account 的写法：
// 目录 api/admin 对应包名 api.admin（docs/接口文档.md §12.9 行 1746「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/admin;api";

// GET /api/admin/settings 无查询参数，不定义 Request；
// 报文字段集合 = §5.6 行 1275-1338 四张表之和，键名不得另起别名（行 1309、1338），
// 编号按「密码策略 → 账号策略 → 验证码限流 → 其余」的表序与行序从 1 起连续（§12.9 行 1748），
// Request 与 Response 同键同编号（§12.8 只增字段约定下双端可独立演进）。

// SettingsRequest 是 POST /api/admin/settings 的请求（§5.6 行 1270「全部系统配置」）：
// 全量提交——前端以 GET 结果为底稿改后整体回写；protojson 严格模式拒绝未知字段，
// 「写入不接受表外键名」由 codec 层直接保证（行 1270）。改动热更新、只对后续请求生效（行 1338）。
// 标量字段不标 optional：全量提交语义下零值即写入值（如 pwd_ban_ttl 调 0），
// repeated 字段空数组即清空该列表；值域交叉约束由前端设置页与管理员自律保证，
// 后端写入仅校验键名与值类型（行 1338）。成功返回 OkResponse。
message SettingsRequest {
  // —— 密码策略（§5.6 行 1275-1291，键名与默认值的唯一定义处）——
  // 最小长度，默认 8（§5.6 行 1279）。
  int64 pwd_min_length = 1;
  // 最大长度，默认 64；可调低不可调高，服务端硬上限 64（§5.6 行 1280）。
  int64 pwd_max_length = 2;
  // 须满足的字符类数（1-3），字符类 = 大写 / 小写 / 数字（§5.6 行 1281）。
  int64 pwd_require_classes = 3;
  // 禁止密码包含用户名，默认 true（§5.6 行 1282）。
  bool pwd_disallow_username = 4;
  // 禁止命中弱口令字典，默认 true（§5.6 行 1283）。
  bool pwd_disallow_common = 5;
  // —— 账号策略（§5.6 行 1293-1297）——
  // 是否开放自助重置密码，默认 true；false 时 §2.4 一律 status=reset_disabled（§5.6 行 1297）。
  bool allow_password_reset = 6;
  // —— 验证码限流（§5.6 行 1299-1307）——
  // 同目标重发冷却（秒），默认 60（§5.6 行 1303）。
  int64 otp_resend_interval = 7;
  // 验证码有效期（秒），默认 300（§5.6 行 1304）。
  int64 otp_ttl = 8;
  // 单条验证码最大校验失败次数，超限即作废，默认 5（§5.6 行 1305）。
  int64 otp_max_attempts = 9;
  // 单目标每日发送上限（次），默认 10（§5.6 行 1306）。
  int64 otp_daily_limit_target = 10;
  // 单 IP 每日发送上限（次），默认 50（§5.6 行 1307）。
  int64 otp_daily_limit_ip = 11;
  // —— 其余设置项（§5.6 行 1309-1336）——
  // 已启用的登录方式（因子名 / thirdparty），只控登录，默认全开（§5.6 行 1313）。
  repeated string login_methods = 12;
  // 注册总开关，默认 true；false 时 §2.3 一律 status=signup_disabled（§5.6 行 1314）。
  bool allow_registration = 13;
  // 用户名 + 密码注册入口，默认 true（§5.6 行 1315）。
  bool allow_signup_password = 14;
  // 手机号注册入口，默认 true（§5.6 行 1316）。
  bool allow_signup_phone = 15;
  // 邮箱注册入口，默认 true（§5.6 行 1317）。
  bool allow_signup_email = 16;
  // 两步验证总开关，默认 true；关闭后 mfa_policy.required 恒为 false（§5.6 行 1318）。
  bool mfa_enabled = 17;
  // 系统开放的二次因子集合（recovery_code 随 totp 生效，不单列）（§5.6 行 1319）。
  repeated string mfa_methods = 18;
  // 同一账号当日密码错误达此次数后登录必须携带人机校验，默认 3（§5.6 行 1320）。
  int64 pwd_fail_capture = 19;
  // 累计失败达此次数后禁止密码登录，默认 6（§5.6 行 1321）。
  int64 pwd_fail_ban = 20;
  // 禁止密码登录时长（秒），默认 21600 即 6 小时（§5.6 行 1322）。
  int64 pwd_ban_ttl = 21;
  // 会话与 Cookie 有效期（秒），默认 604800 即 7 天（§5.6 行 1323）。
  int64 session_ttl = 22;
  // 会话 Cookie 名，默认 al_session（§5.6 行 1324）。
  string cookie_name = 23;
  // 多根域名同步列表，登录 / 登出时逐个同步（§5.6 行 1325、§2.9）。
  repeated string sso_domains = 24;
  // 延迟写入队列 worker 数，默认 4（§5.6 行 1326）。
  int64 queue_workers = 25;
  // 队列长度（ring buffer），默认 8192（§5.6 行 1327）。
  int64 queue_capacity = 26;
  // 攒批条数阈值，默认 200（§5.6 行 1328）。
  int64 queue_batch = 27;
  // 攒批时间窗（毫秒），默认 2000（§5.6 行 1329）。
  int64 queue_flush_ms = 28;
  // 当前生效的 captcha Provider；空串 = 内置图形码 builtin_image（§5.6 行 1330）。
  string captcha_provider_key = 29;
  // 当前生效的短信 Provider（§5.6 行 1331）。
  string sms_provider_key = 30;
  // 当前生效的邮件 Provider（§5.6 行 1332）。
  string email_provider_key = 31;
  // 头像 / 渠道图标使用的 Storage Provider（§5.6 行 1333）。
  string avatar_storage_provider = 32;
  // 网关 Token 列表，可多个（§5.6 行 1334、§6）。
  repeated string gateway_tokens = 33;
  // 事件日志保留天数，默认 180（§5.6 行 1335）。
  int64 eventlog_retention_days = 34;
  // 静态资源基址（CDN），改后需刷新页面生效（§5.6 行 1336、§8）。
  string static_base = 35;
}

// SettingsResponse 是 GET /api/admin/settings 的响应（§5.6 行 1270）：
// 键集合、键名、编号与 SettingsRequest 完全一致；标量与列表字段按 §12.9 行 1753
// 恒存在口径输出（零值 / 空串 / false / 空数组）。
message SettingsResponse {
  // —— 密码策略（§5.6 行 1275-1291）——
  // 最小长度，默认 8（§5.6 行 1279）。
  int64 pwd_min_length = 1;
  // 最大长度，默认 64（§5.6 行 1280）。
  int64 pwd_max_length = 2;
  // 须满足的字符类数（1-3），默认 3（§5.6 行 1281）。
  int64 pwd_require_classes = 3;
  // 禁止密码包含用户名，默认 true（§5.6 行 1282）。
  bool pwd_disallow_username = 4;
  // 禁止命中弱口令字典，默认 true（§5.6 行 1283）。
  bool pwd_disallow_common = 5;
  // —— 账号策略（§5.6 行 1293-1297）——
  // 是否开放自助重置密码，默认 true（§5.6 行 1297）。
  bool allow_password_reset = 6;
  // —— 验证码限流（§5.6 行 1299-1307）——
  // 同目标重发冷却（秒），默认 60（§5.6 行 1303）。
  int64 otp_resend_interval = 7;
  // 验证码有效期（秒），默认 300（§5.6 行 1304）。
  int64 otp_ttl = 8;
  // 单条验证码最大校验失败次数，默认 5（§5.6 行 1305）。
  int64 otp_max_attempts = 9;
  // 单目标每日发送上限（次），默认 10（§5.6 行 1306）。
  int64 otp_daily_limit_target = 10;
  // 单 IP 每日发送上限（次），默认 50（§5.6 行 1307）。
  int64 otp_daily_limit_ip = 11;
  // —— 其余设置项（§5.6 行 1309-1336）——
  // 已启用的登录方式，默认 ["password","otp_sms","otp_email","webauthn","thirdparty"]（§5.6 行 1313）。
  repeated string login_methods = 12;
  // 注册总开关，默认 true（§5.6 行 1314）。
  bool allow_registration = 13;
  // 用户名 + 密码注册入口，默认 true（§5.6 行 1315）。
  bool allow_signup_password = 14;
  // 手机号注册入口，默认 true（§5.6 行 1316）。
  bool allow_signup_phone = 15;
  // 邮箱注册入口，默认 true（§5.6 行 1317）。
  bool allow_signup_email = 16;
  // 两步验证总开关，默认 true（§5.6 行 1318）。
  bool mfa_enabled = 17;
  // 系统开放的二次因子集合，默认 ["totp","otp_sms","otp_email","webauthn"]（§5.6 行 1319）。
  repeated string mfa_methods = 18;
  // 密码错误人机校验阈值，默认 3（§5.6 行 1320）。
  int64 pwd_fail_capture = 19;
  // 密码登录禁止阈值，默认 6（§5.6 行 1321）。
  int64 pwd_fail_ban = 20;
  // 禁止密码登录时长（秒），默认 21600（§5.6 行 1322）。
  int64 pwd_ban_ttl = 21;
  // 会话与 Cookie 有效期（秒），默认 604800（§5.6 行 1323）。
  int64 session_ttl = 22;
  // 会话 Cookie 名，默认 al_session（§5.6 行 1324）。
  string cookie_name = 23;
  // 多根域名同步列表，默认 []（§5.6 行 1325）。
  repeated string sso_domains = 24;
  // 延迟写入队列 worker 数，默认 4（§5.6 行 1326）。
  int64 queue_workers = 25;
  // 队列长度（ring buffer），默认 8192（§5.6 行 1327）。
  int64 queue_capacity = 26;
  // 攒批条数阈值，默认 200（§5.6 行 1328）。
  int64 queue_batch = 27;
  // 攒批时间窗（毫秒），默认 2000（§5.6 行 1329）。
  int64 queue_flush_ms = 28;
  // 当前生效的 captcha Provider，默认空串（§5.6 行 1330）。
  string captcha_provider_key = 29;
  // 当前生效的短信 Provider，默认空串（§5.6 行 1331）。
  string sms_provider_key = 30;
  // 当前生效的邮件 Provider，默认空串（§5.6 行 1332）。
  string email_provider_key = 31;
  // 头像 / 渠道图标使用的 Storage Provider，默认空串（§5.6 行 1333）。
  string avatar_storage_provider = 32;
  // 网关 Token 列表，默认 []（§5.6 行 1334）。
  repeated string gateway_tokens = 33;
  // 事件日志保留天数，默认 180（§5.6 行 1335）。
  int64 eventlog_retention_days = 34;
  // 静态资源基址（CDN），默认 /assets（§5.6 行 1336）。
  string static_base = 35;
}
