syntax = "proto3";

package api.admin;

// SchemaField.default 用 google.protobuf.Value 承载任意 JSON 默认值
// （§5.3 行 1211 "social"、行 1212 0、行 1215 true）。
import "google/protobuf/struct.proto";

// Go 包名沿用 api.common / api.sso / api.account 的写法：
// 目录 api/admin 对应包名 api.admin（docs/接口文档.md §12.9 行 1746「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/admin;api";

// SchemaRequest 是 GET /api/admin/providers/schema 的查询串
// （§5.2 行 1172、§5.3 行 1177：?type=wechat_mp）。
message SchemaRequest {
  // Provider 类型，必填（§5.3 行 1183）。
  string type = 1;
}

// SchemaField 是动态表单 schema 的单个字段（§5.3 行 1179）：
// { "key", "label", "type", "section", "required", "default", "options", "pattern", "advanced", "help" }，
// 字段名与该列表逐字一致，编号按列表顺序从 1 起连续（§12.9 行 1748）。
message SchemaField {
  // 恒等于 provider 表列名或 provider.Ext 字段名，提交体即 { "<key>": <value> }（§5.3 行 1179）。
  string key = 1;
  // 展示文案（§5.3 行 1188）。
  string label = 2;
  // 渲染类型，取值是 §5.3 行 1225 的六个：text|secret|checkbox|number|select|json；
  // §12.9 行 1752 明确 fields[].type 跨版本可能新增，用 string 承载。
  string type = 3;
  // 表单区块，取值封闭：basic|credential|endpoint|display|policy（§5.3 行 1181）；
  // 每个字段都必须带 section，前端不维护 key → 区块映射表（行 1181）；
  // 新增区块须双端同步，沿用 string 承载（§12.9 行 1752）。
  string section = 4;
  // 是否必填（§5.3 行 1188）。
  bool required = 5;
  // 默认值，任意 JSON 值（§5.3 行 1211-1215）；未设置时 JSON 视图为 null（§12.9 行 1753 口径由生成侧保证）。
  google.protobuf.Value default = 6;
  // select 类型的取值集合，与 §1.11 同名同义（§5.3 行 1191、行 1225）。
  repeated string options = 7;
  // 校验正则，如 ^[a-z0-9_]+$（§5.3 行 1188）。
  string pattern = 8;
  // 区块内是否折叠（§5.3 行 1198、行 1225：advanced 只管单个字段在区块内是否折叠）。
  bool advanced = 9;
  // 帮助文案（§5.3 行 1189）。
  string help = 10;
}

// SchemaResponse 是 GET /api/admin/providers/schema 的响应（§5.3 行 1179）：
// 输出结构固定为 { "type": "…", "category": "…", "fields": [ … ] }。
message SchemaResponse {
  // Provider 类型（§5.3 行 1186）。
  string type = 1;
  // 类别，由注册表按 type 决定（§5.3 行 1192）。
  string category = 2;
  // 字段集合，同一字段在五区块中的顺序沿用 fields[] 数组顺序（§5.3 行 1181）。
  repeated SchemaField fields = 3;
}

// ProviderType 是 GET /api/admin/providers/types 的下拉条目（§5.2 行 1171
// 「Provider type 下拉数据源（来自注册表 metas）」，《后端架构》§15.3 行 1680）。
// display_name 文档未定义，按下拉数据源三要素（值 / 分组 / 展示名）最小定义，
// 待定。
message ProviderType {
  // 类型，即 /api/admin/providers/schema 的 type 入参（§5.2 行 1172）。
  string type = 1;
  // 类别，由注册表 meta 声明（《后端架构》§15.3 行 1680）。
  string category = 2;
  // 类型展示名，下拉渲染用。
  string display_name = 3;
}

// ProviderTypesResponse 是 GET /api/admin/providers/types 的响应（§5.2 行 1171）。
// 注册表条目为有限集（下拉数据源），不分页（§1.7 行 271 仅约束管理后台 / 日志类列表）。
message ProviderTypesResponse {
  // 全部已注册类型（§5.2 行 1171）。
  repeated ProviderType items = 1;
}
