syntax = "proto3";

package api.admin;

// DecodeResponse.payload 用 google.protobuf.Struct 原样透传递码内容
// （oidc/credential 及同类透传字段同口径）。
import "google/protobuf/struct.proto";

// Go 包名沿用 api.common / api.sso / api.account 的写法：
// 目录 api/admin 对应包名 api.admin（docs/接口文档.md §12.9 行 1746「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/admin;api";

// DecodeRequest 是 POST /api/admin/decode 的请求（§5.6 行 1272：
// {token, purpose:"login"|"session"|"cookie"}），排障用。
message DecodeRequest {
  // 待解码令牌（§5.6 行 1272）。
  string token = 1;
  // 解码口径 login|session|cookie：cookie 解 al_login_state（《后端架构》§11.6.1 的
  // purpose 口径）；随令牌类型演进可能新增，用 string 承载（§12.9 行 1752）。
  string purpose = 2;
}

// DecodeResponse 是 POST /api/admin/decode 的响应（§5.6 行 1272「解码内容，排障用」）：
// 令牌与内部载荷定义在《后端架构》§11.6（§12.4 行 1729 指向，前端不解析），
// 各 purpose 结构不同且不为前台消费，按同口径用 google.protobuf.Struct 原样透传。
message DecodeResponse {
  // 解码出的载荷字段（§5.6 行 1272）。
  google.protobuf.Struct payload = 1;
}

// StatusResponse 是 GET /api/admin/status 的响应（§5.6 行 1273
// 「监控：队列长度 / dropped / flush 耗时」；《后端架构》§16 行 1705）。
// 不含会话活跃数——该指标无数据来源，已删除且不另起计数。
message StatusResponse {
  // 当前队列长度（《后端架构》§16 行 1705）。
  int64 queue_length = 1;
  // 累计丢弃条数（《后端架构》§16 行 1705）。
  int64 dropped = 2;
  // 最近一次 flush 耗时（毫秒）；与设置项 queue_flush_ms（攒批时间窗，§5.6 行 1329）不同名不同义。
  int64 flush_ms = 3;
}
