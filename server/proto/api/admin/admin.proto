syntax = "proto3";

package api.admin;

// Go 包名沿用 api.common / api.sso / api.account 的写法：
// 目录 api/admin 对应包名 api.admin（docs/接口文档.md §12.9 行 1746「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/admin;api";

// MeResponse 是 GET /api/admin/me 的响应（docs/接口文档.md §5.1 行 1158）：
// 前端获取管理员信息的唯一来源——/admin/** 空壳页不注入 admin 字段（§5 行 1146）。
// 字段名与 §5.1 行 1158 的 {id, username, nickname, avatar_url, is_admin:true} 逐字一致，
// 编号从 1 起连续（§12.9 行 1748）。
message MeResponse {
  // 管理员固定为安装时创建的 user.id = 1 账号（§5 行 1143、§13）。
  int64 id = 1;
  // 登录名（§5.1 行 1158）。
  string username = 2;
  // 昵称（§5.1 行 1158）。
  string nickname = 3;
  // 头像地址（§5.1 行 1158）。
  string avatar_url = 4;
  // 恒为 true：非管理员在 /api/admin/** 中间件即被拦下，不会走到这里（§5.1 行 1158）。
  bool is_admin = 5;
}

// OkResponse 是 §5 文档未定义出参的写端点共用的空应答
// （provider 删除/开关/排序/测试，用户状态切换/重置密码/解绑/解锁，客户端写）：
// 经 codec WriteSuccess 输出 {"status":"success"}（§1.0 行 56；codec/write.go 空数据消息即纯信封；
// {ok:true} 口径已被取代，无数据字段的写端点成功即纯信封）。
// 本消息不携带任何字段，也不得加 status——信封顶层 status 为保留字，由 codec 注入
// （WriteSuccess 数据消息顶层禁用 status 字段）。
message OkResponse {}
