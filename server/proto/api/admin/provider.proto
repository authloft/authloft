syntax = "proto3";

package api.admin;

// AdminProvider.ext 用 google.protobuf.Struct 承载 provider.Ext 的明文透出（§12.1 行 1635-1689）。
import "google/protobuf/struct.proto";

// Go 包名沿用 api.common / api.sso / api.account 的写法：
// 目录 api/admin 对应包名 api.admin（docs/接口文档.md §12.9 行 1746「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/admin;api";

// POST /api/admin/providers（§5.2 行 1165）与 PUT /api/admin/providers/{provider_key}（行 1167）
// 不定义包装 Request：请求体是 §5.3 行 1179「提交体即 { "<key>": <value> }」的动态键集合，
// key 恒为 provider 表列名或 provider.Ext 字段名（§5.3 行 1227-1239），随 type 演进、
// 新增渠道零前端改动（行 1181）——固定消息无法建模，包装字段又会破坏平铺提交体，
// handler 直接以 google.protobuf.Struct 绑定请求体（与 oidc/credential 用 Struct 同口径）。
// DELETE /api/admin/providers/{provider_key}（行 1168）无请求体，成功返回 OkResponse。

// Provider 是 GET /api/admin/providers 的列表项（§5.2 行 1164）：
// 列表列「显示名 / provider_key / 类别 / 类型 / 状态 / 策略标签 / 排序」。
// 「状态」即 provider.is_enabled（§5.3 行 1215 同键），「策略标签」即登录 / 注册 / 自动绑定
// 三个策略开关（《后端架构》§4.1 行 605-608）；开关类字段按 §12.9 行 1750 用 bool 承载。
message Provider {
  // 全局唯一标识，创建后不可改（§12.1 行 1694）。
  string provider_key = 1;
  // 展示名（§5.2 行 1164、《后端架构》§4.1 行 601）。
  string display_name = 2;
  // 类别，取值 oauth|captcha|sms|email|storage|notify|union（《后端架构》§4.1 行 602）；
  // 跨版本可能新增，用 string 承载（§12.9 行 1752）。
  string category = 3;
  // 类型，取值来自注册表 metas（§5.2 行 1171、《后端架构》§15.3 行 1680）。
  string type = 4;
  // 「状态」列：是否启用（§5.2 行 1169、§5.3 行 1215）。
  bool is_enabled = 5;
  // 策略标签：允许用于登录（《后端架构》§4.1 行 605）。
  bool enable_signin = 6;
  // 策略标签：允许该渠道建号（《后端架构》§4.1 行 606）。
  bool enable_signup = 7;
  // 策略标签：按联系方式自动绑定（《后端架构》§4.1 行 607）。
  bool auto_bind = 8;
  // 排序（《后端架构》§4.1 行 612）；整型一律 int64（§12.9 行 1750）。
  int64 sort_order = 9;
}

// ProviderListRequest 是 GET /api/admin/providers 的查询串（§5.2 行 1164
// ?category=&type=&is_enabled=）；所有列表支持 §1.7 分页（§5 行 1152）。
// 查询参数缺省即不过滤，一律 optional 以区分「未传」与零值。
message ProviderListRequest {
  // 按类别过滤（§5.2 行 1164）。
  optional string category = 1;
  // 按类型过滤（§5.2 行 1164）。
  optional string type = 2;
  // 按启用状态过滤（§5.2 行 1164）。
  optional bool is_enabled = 3;
  // 页码，从 1 开始（§1.7 行 273）。
  optional int64 page = 4;
  // 每页条数，默认 20、上限 100（§1.7 行 273）。
  optional int64 page_size = 5;
  // 排序字段，取值由前端限定（§1.7 行 273）。
  optional string sort = 6;
  // 排序方向 asc/desc（§1.7 行 273）。
  optional string order = 7;
}

// ProviderListResponse 是 GET /api/admin/providers 的响应（§5.2 行 1164、§1.7 行 274：
// {items, total, page, page_size}）。
message ProviderListResponse {
  // 当前页数据（§1.7 行 274）。
  repeated Provider items = 1;
  // 总条数（§1.7 行 274）。
  int64 total = 2;
  // 页码（§1.7 行 274）。
  int64 page = 3;
  // 每页条数（§1.7 行 274）。
  int64 page_size = 4;
}

// AdminProvider 是 GET /api/admin/providers/{provider_key} 的详情响应（§5.2 行 1166
// 「返回明文凭证，需管理员会话」），即 §12.9 行 1751 所指的 AdminProvider 管理视图：
// 全站唯一明文凭证出口——注入快照与前台接口永不返回 ext 中任何凭证字段（§12.1 行 1695）。
// provider 表列是封闭集，typed 透出；ext 是开放扩展（§12.1 行 1637「凭证 / 端点 / 存储
// 配置 / 厂商长尾全部进此结构」），按同口径用 google.protobuf.Struct 明文透出。
message AdminProvider {
  // 全局唯一标识（§12.1 行 1694）。
  string provider_key = 1;
  // 联合登录归属 Provider，仅列 category=union 的取值（§5.3 行 1193、《后端架构》§4.1 行 600）。
  string union_provider = 2;
  // 展示名（《后端架构》§4.1 行 601）。
  string display_name = 3;
  // 类别（《后端架构》§4.1 行 602）。
  string category = 4;
  // 类型（《后端架构》§4.1 行 603）。
  string type = 5;
  // 允许用于登录（《后端架构》§4.1 行 605）。
  bool enable_signin = 6;
  // 允许该渠道建号（《后端架构》§4.1 行 606）。
  bool enable_signup = 7;
  // 按联系方式自动绑定（《后端架构》§4.1 行 607）。
  bool auto_bind = 8;
  // 自动绑定字段，auto_bind 开启时生效（《后端架构》§4.1 行 608）。
  string auto_bind_fields = 9;
  // 是否启用（《后端架构》§4.1 行 609）。
  bool is_enabled = 10;
  // 展示分组 social|enterprise|dev|other（§5.3 行 1211）。
  string ui_group = 11;
  // 排序（《后端架构》§4.1 行 612）。
  int64 sort_order = 12;
  // 图标 URL，绝对地址（§5.3 行 1209）。
  string icon_url = 13;
  // 备注（§5.3 行 1213）。
  string remark = 14;
  // provider.Ext 全量明文，键即 §5.3 schema 的 key（§12.1 行 1635-1689、§5.3 行 1179）。
  google.protobuf.Struct ext = 15;
  // 创建时间，Unix 秒（《后端架构》§4.1 行 618）。
  int64 created_at = 16;
  // 更新时间，Unix 秒（《后端架构》§4.1 行 619）。
  int64 updated_at = 17;
}

// ProviderEnableRequest 是 POST /api/admin/providers/{provider_key}/enable 的请求
// （§5.2 行 1169：{is_enabled:bool} 行内开关）。成功返回 OkResponse。
message ProviderEnableRequest {
  // 行内开关目标态（§5.2 行 1169）。
  bool is_enabled = 1;
}

// ProviderSortItem 是拖拽排序的单个条目（§5.2 行 1170：{items:[{provider_key, sort_order}]}）。
message ProviderSortItem {
  // 要排序的 Provider（§5.2 行 1170）。
  string provider_key = 1;
  // 目标排序值（§5.2 行 1170）。
  int64 sort_order = 2;
}

// ProviderSortRequest 是 POST /api/admin/providers/sort 的请求（§5.2 行 1170）。
// 成功返回 OkResponse。
message ProviderSortRequest {
  // 拖拽排序后的条目集合（§5.2 行 1170）。
  repeated ProviderSortItem items = 1;
}

// ProviderTestRequest 是 POST /api/admin/providers/{provider_key}/test 的请求
// （§5.2 行 1173：短信 / 邮件 Provider 的「发送测试」）。成功返回 OkResponse。
// §5.2 未定义请求体；发送测试必须有接收目标（《后端架构》§15.2 行 1668 Sender.Send(to,…)
// 的首参），故按最小必填报文定义 target（待定）。
message ProviderTestRequest {
  // 测试接收目标：短信 Provider 为手机号、邮件 Provider 为邮箱（《后端架构》§15.2 行 1668）。
  string target = 1;
}
