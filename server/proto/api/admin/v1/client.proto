syntax = "proto3";

package api.admin.v1;

// 包名 api.admin.v1（docs/接口文档.md §12.9「包名 api.<域>.v1」）
// 目录 api/admin/v1 与包名逐段一致。Go 产物：authloft/gen/go/api/admin/v1（adminv1）。
option go_package = "authloft/gen/go/api/admin/v1;adminv1";

// 客户端仅支持后台手动创建（§5.5，需求 §4.4.4 / §4.4.5）；
// OIDC 客户端不设授权类型字段：本期固定支持 authorization_code 与 refresh_token
//（§5.5）。

// SsoClient 是 AdminService/ListSsoClients 的列表项，也是 GetSsoClient 的详情响应：
// 字段 client_id、client_secret、name、redirectUris[]（支持 *）取自 §5.5 逐字，
// id / created_at / updated_at 为《后端架构》§4.4 的行投影（§5.5 未列出，列表与详情
// 按行透出）。sso_client.is_enabled 无对应端点行为，不在报文中出现。
message SsoClient {
  // 数据库自增 ID，GetSsoClient / UpdateSsoClient / DeleteSsoClient 的目标 id
  //（§5.5、《后端架构》§4.4）。
  int64 id = 1;
  // 客户端标识，全局唯一（§5.5、《后端架构》§4.4）。
  string client_id = 2;
  // 客户端密钥（§5.5、《后端架构》§4.4）。
  string client_secret = 3;
  // 展示名（§5.5、《后端架构》§4.4）。
  string name = 4;
  // 回调白名单，支持 * 通配、整段匹配（§5.5、§12.3）。
  repeated string redirect_uris = 5;
  // 创建时间，Unix 秒（《后端架构》§4.4）。
  int64 created_at = 6;
  // 更新时间，Unix 秒（《后端架构》§4.4）。
  int64 updated_at = 7;
  // 渲染空壳使用的模板 key（内置 key 或 DB 自定义模板 template_key）；
  // 空 / 未设置回落默认文件壳（§5.5「客户端模板字段」）。
  string template_key = 8;
  // 模板变量的 JSON 对象文本，未配置按空对象 {} 注入；
  // 只影响页面壳渲染、不参与 OIDC 协议校验（§5.5「客户端模板字段」）。
  string template_vars = 9;
  // 该应用可用的登录方式（§5.5「SSO 应用级登录配置」）：封闭集
  // password | otp_sms | otp_email | webauthn | thirdparty；thirdparty 是
  // OAuth Provider 的整体开关，明细由 oauth_providers 控制。空 = 跟随全局。
  repeated string login_methods = 10;
  // 该应用可用的 OAuth Provider key 白名单（§5.5）；空 = 跟随全局。
  repeated string oauth_providers = 11;
  // 登录完成且未传回跳地址（无 returnTo、无 OIDC 上下文）时的默认回跳地址
  //（§5.5）；空 = 未配置，维持默认落点。
  string default_redirect_uri = 12;
}

// ListSsoClientsRequest 是 AdminService/ListSsoClients 的请求（§5.5）；
// 所有列表支持 §1.7 分页（§5）。分页与排序字段进请求消息（§1.7）
// 缺省即服务端默认分页，一律 optional。消息名随方法名（§12.9；
// pre-connect 时代按资源命名 SsoClientListRequest，Connect 化时更名）。
message ListSsoClientsRequest {
  // 页码，从 1 开始（§1.7）。
  optional int64 page = 1;
  // 每页条数，默认 20、上限 100（§1.7）。
  optional int64 page_size = 2;
  // 排序字段，取值由前端限定（§1.7）。
  optional string sort = 3;
  // 排序方向 asc/desc（§1.7）。
  optional string order = 4;
}

// SsoClientListResponse 是 AdminService/ListSsoClients 的响应（§5.5、§1.7）。
// 响应名沿用资源式命名（buf RPC_RESPONSE_STANDARD_NAME 豁免）。
message SsoClientListResponse {
  // 当前页数据（§1.7）。
  repeated SsoClient items = 1;
  // 总条数（§1.7）。
  int64 total = 2;
  // 页码（§1.7）。
  int64 page = 3;
  // 每页条数（§1.7）。
  int64 page_size = 4;
}

// CreateSsoClientRequest 是 AdminService/CreateSsoClient 的请求（§5.5 新建）：
// id 由服务端分配，不进请求体。成功返回 OkResponse。
// pre-connect 时代与编辑共用 SsoClientSaveRequest，Connect 化后随方法名分立
//（编辑须携带路径参数 id，消息名随方法名，§12.9）。
message CreateSsoClientRequest {
  // 客户端标识（§5.5）。
  string client_id = 1;
  // 客户端密钥（§5.5）。
  string client_secret = 2;
  // 展示名（§5.5）。
  string name = 3;
  // 回调白名单，支持 * 通配（§5.5）。
  repeated string redirect_uris = 4;
  // 渲染空壳使用的模板 key，空 / 未设置回落默认文件壳（§5.5「客户端模板字段」）。
  string template_key = 5;
  // 模板变量的 JSON 对象文本，未配置按空对象 {} 注入（§5.5「客户端模板字段」）。
  string template_vars = 6;
  // 该应用可用的登录方式（§5.5）：封闭集 password | otp_sms | otp_email |
  // webauthn | thirdparty；空 = 未配置 = 跟随全局。
  repeated string login_methods = 7;
  // 该应用可用的 OAuth Provider key 白名单（§5.5）；空 = 跟随全局。
  repeated string oauth_providers = 8;
  // 默认回跳地址（§5.5）。proto3 optional 区分「缺省 / 显式空串」：
  // has 位 true 且空串 = 清空为跟随现状，非空 = 覆盖，缺省 = 不动（§5.5）。
  optional string default_redirect_uri = 9;
  // login_methods 的伴生标志（§5.5 PATCH 语义，先例同 §5.6 settings 写入口径）：
  // true = 整组替换（空数组 = 清空为跟随全局），缺省 = 不动。
  optional bool has_login_methods = 10;
  // oauth_providers 的伴生标志，语义同 has_login_methods（§5.5）。
  optional bool has_oauth_providers = 11;
}

// GetSsoClientRequest 是 AdminService/GetSsoClient 的请求（§5.5）。
// id 为 pre-connect 时代的 REST 路径参数，Connect 化后进请求消息。
message GetSsoClientRequest {
  // 目标客户端 ID（§5.5）。
  int64 id = 1;
}

// UpdateSsoClientRequest 是 AdminService/UpdateSsoClient 的请求（§5.5 编辑）：
// 字段同 §5.5，另携带目标 id（pre-connect 时代的 REST 路径参数）。
// 成功返回 OkResponse。
message UpdateSsoClientRequest {
  // 目标客户端 ID（§5.5）。
  int64 id = 1;
  // 客户端标识（§5.5）。
  string client_id = 2;
  // 客户端密钥（§5.5）。
  string client_secret = 3;
  // 展示名（§5.5）。
  string name = 4;
  // 回调白名单，支持 * 通配（§5.5）。
  repeated string redirect_uris = 5;
  // 渲染空壳使用的模板 key，空 / 未设置回落默认文件壳（§5.5「客户端模板字段」）。
  string template_key = 6;
  // 模板变量的 JSON 对象文本，未配置按空对象 {} 注入（§5.5「客户端模板字段」）。
  string template_vars = 7;
  // 该应用可用的登录方式（§5.5）：封闭集 password | otp_sms | otp_email |
  // webauthn | thirdparty；空 = 未配置 = 跟随全局。
  repeated string login_methods = 8;
  // 该应用可用的 OAuth Provider key 白名单（§5.5）；空 = 跟随全局。
  repeated string oauth_providers = 9;
  // 默认回跳地址（§5.5）。proto3 optional 区分「缺省 / 显式空串」：
  // has 位 true 且空串 = 清空为跟随现状，非空 = 覆盖，缺省 = 不动（§5.5）。
  optional string default_redirect_uri = 10;
  // login_methods 的伴生标志（§5.5 PATCH 语义，先例同 §5.6 settings 写入口径）：
  // true = 整组替换（空数组 = 清空为跟随全局），缺省 = 不动。
  optional bool has_login_methods = 11;
  // oauth_providers 的伴生标志，语义同 has_login_methods（§5.5）。
  optional bool has_oauth_providers = 12;
}

// DeleteSsoClientRequest 是 AdminService/DeleteSsoClient 的请求（§5.5）。
// 成功返回 OkResponse。
message DeleteSsoClientRequest {
  // 目标客户端 ID（§5.5）。
  int64 id = 1;
}

// OidcClient 是 AdminService/ListOidcClients 的列表项，也是 GetOidcClient 的详情响应：
// 在 SSO 字段基线上额外增加 scopes[]、accessTokenTtl、refreshTokenTtl
//（§5.5「额外」逐字），id / created_at / updated_at 为《后端架构》§4.5 的行投影。
message OidcClient {
  // 数据库自增 ID，GetOidcClient / UpdateOidcClient / DeleteOidcClient 的目标 id
  //（§5.5、《后端架构》§4.5）。
  int64 id = 1;
  // 客户端标识，全局唯一（§5.5、《后端架构》§4.5）。
  string client_id = 2;
  // 客户端密钥（§5.5、《后端架构》§4.5）。
  string client_secret = 3;
  // 展示名（§5.5、《后端架构》§4.5）。
  string name = 4;
  // 回调白名单，支持 * 通配、整段匹配（§5.5、§12.3）。
  repeated string redirect_uris = 5;
  // 授权范围（§5.5）；库内逗号分隔存储，报文按数组承载（§12.9）。
  repeated string scopes = 6;
  // 访问令牌有效期（秒），默认 3600（§5.5、《后端架构》§4.5）。
  int64 access_token_ttl = 7;
  // 刷新令牌有效期（秒），默认 2592000（§5.5、《后端架构》§4.5）。
  int64 refresh_token_ttl = 8;
  // 创建时间，Unix 秒（《后端架构》§4.5）。
  int64 created_at = 9;
  // 更新时间，Unix 秒（《后端架构》§4.5）。
  int64 updated_at = 10;
  // 渲染空壳使用的模板 key（内置 key 或 DB 自定义模板 template_key）；
  // 空 / 未设置回落默认文件壳（§5.5「客户端模板字段」）。
  string template_key = 11;
  // 模板变量的 JSON 对象文本，未配置按空对象 {} 注入；
  // 只影响页面壳渲染、不参与 OIDC 协议校验（§5.5「客户端模板字段」）。
  string template_vars = 12;
}

// ListOidcClientsRequest 是 AdminService/ListOidcClients 的请求（§5.5）；
// 所有列表支持 §1.7 分页（§5）。消息名随方法名（§12.9）。
message ListOidcClientsRequest {
  // 页码，从 1 开始（§1.7）。
  optional int64 page = 1;
  // 每页条数，默认 20、上限 100（§1.7）。
  optional int64 page_size = 2;
  // 排序字段，取值由前端限定（§1.7）。
  optional string sort = 3;
  // 排序方向 asc/desc（§1.7）。
  optional string order = 4;
}

// OidcClientListResponse 是 AdminService/ListOidcClients 的响应（§5.5、§1.7）。
// 响应名沿用资源式命名（buf 豁免同上）。
message OidcClientListResponse {
  // 当前页数据（§1.7）。
  repeated OidcClient items = 1;
  // 总条数（§1.7）。
  int64 total = 2;
  // 页码（§1.7）。
  int64 page = 3;
  // 每页条数（§1.7）。
  int64 page_size = 4;
}

// CreateOidcClientRequest 是 AdminService/CreateOidcClient 的请求（§5.5 新建）：
// id 由服务端分配，不进请求体。成功返回 OkResponse。
// pre-connect 时代与编辑共用 OidcClientSaveRequest，Connect 化后随方法名分立。
message CreateOidcClientRequest {
  // 客户端标识（§5.5）。
  string client_id = 1;
  // 客户端密钥（§5.5）。
  string client_secret = 2;
  // 展示名（§5.5）。
  string name = 3;
  // 回调白名单，支持 * 通配（§5.5）。
  repeated string redirect_uris = 4;
  // 授权范围（§5.5）。
  repeated string scopes = 5;
  // 访问令牌有效期（秒）（§5.5）。
  int64 access_token_ttl = 6;
  // 刷新令牌有效期（秒）（§5.5）。
  int64 refresh_token_ttl = 7;
  // 渲染空壳使用的模板 key，空 / 未设置回落默认文件壳（§5.5「客户端模板字段」）。
  string template_key = 8;
  // 模板变量的 JSON 对象文本，未配置按空对象 {} 注入（§5.5「客户端模板字段」）。
  string template_vars = 9;
}

// GetOidcClientRequest 是 AdminService/GetOidcClient 的请求（§5.5）。
// id 为 pre-connect 时代的 REST 路径参数，Connect 化后进请求消息。
message GetOidcClientRequest {
  // 目标客户端 ID（§5.5）。
  int64 id = 1;
}

// UpdateOidcClientRequest 是 AdminService/UpdateOidcClient 的请求（§5.5 编辑）：
// 字段同 §5.5，另携带目标 id。成功返回 OkResponse。
message UpdateOidcClientRequest {
  // 目标客户端 ID（§5.5）。
  int64 id = 1;
  // 客户端标识（§5.5）。
  string client_id = 2;
  // 客户端密钥（§5.5）。
  string client_secret = 3;
  // 展示名（§5.5）。
  string name = 4;
  // 回调白名单，支持 * 通配（§5.5）。
  repeated string redirect_uris = 5;
  // 授权范围（§5.5）。
  repeated string scopes = 6;
  // 访问令牌有效期（秒）（§5.5）。
  int64 access_token_ttl = 7;
  // 刷新令牌有效期（秒）（§5.5）。
  int64 refresh_token_ttl = 8;
  // 渲染空壳使用的模板 key，空 / 未设置回落默认文件壳（§5.5「客户端模板字段」）。
  string template_key = 9;
  // 模板变量的 JSON 对象文本，未配置按空对象 {} 注入（§5.5「客户端模板字段」）。
  string template_vars = 10;
}

// DeleteOidcClientRequest 是 AdminService/DeleteOidcClient 的请求（§5.5）。
// 成功返回 OkResponse。
message DeleteOidcClientRequest {
  // 目标客户端 ID（§5.5）。
  int64 id = 1;
}
