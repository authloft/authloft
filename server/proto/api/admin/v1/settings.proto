syntax = "proto3";

package api.admin.v1;

// 包名 api.admin.v1（docs/接口文档.md §12.9 行 1747「包名 api.<域>.v1」），
// 目录 api/admin/v1 与包名逐段一致。Go 产物：authloft/gen/go/api/admin/v1（adminv1）。
option go_package = "authloft/gen/go/api/admin/v1;adminv1";

// AdminService/GetSettings 无查询参数，请求为空消息；
// 报文字段集合 = §5.6 行 1276-1338 四张表之和，键名不得另起别名（行 1310、行 1339），
// 编号按「密码策略 → 账号策略 → 验证码限流 → 其余」的表序与行序从 1 起连续（§12.9 行 1749）。
// Request 为部分更新：另带四个 has_* 伴生标志（非 settings 键），数据键编号与
// Response 不同；Response 恒输出 36 数据键、不含伴生标志（§12.8 双端独立演进）。

// GetSettingsRequest 是 AdminService/GetSettings 的请求（§5.6 行 1271，无入参）。
message GetSettingsRequest {}

// SetSettingsRequest 是 AdminService/SetSettings 的请求（§5.6 行 1271「全部系统配置」）：
// 部分更新（PATCH）：标量全字段 proto3 optional，未设置 = 不修改（保留现值）、
// 显式设值 = 覆盖（含 0 / false / 空串，如 pwd_ban_ttl 调 0）；四个 repeated
// 键各带 has_* 伴生标志（repeated 无 has 位、protojson 下 [] 与缺省同为 nil）：
// 标志取 true = 列表在场，按数组整组替换，空数组 / 缺省数组 = 清空该列表；
// 标志缺省 / 显式 false = 不修改。前端以 GET 结果为底稿整体回写仍兼容（须
// 一并下发四个标志）；严格模式拒绝未知字段（行 1271），后端仅校验键名与值
// 类型（行 1339），交叉约束由前端设置页与管理员自律保证；改动热更新、只对
// 后续请求生效（行 1339）。消息名随方法名（§12.9 行 1747；pre-connect 时代
// 按资源命名 SettingsRequest，Connect 化时更名）。成功返回 OkResponse。
message SetSettingsRequest {
  // —— 密码策略（§5.6 行 1276-1291，键名与默认值的唯一定义处）——
  // 最小长度，默认 8（§5.6 行 1280）。
  optional int64 pwd_min_length = 1;
  // 最大长度，默认 64；可调低不可调高，服务端硬上限 64（§5.6 行 1281）。
  optional int64 pwd_max_length = 2;
  // 须满足的字符类数（1-3），字符类 = 大写 / 小写 / 数字（§5.6 行 1282）。
  optional int64 pwd_require_classes = 3;
  // 禁止密码包含用户名，默认 true（§5.6 行 1283）。
  optional bool pwd_disallow_username = 4;
  // 禁止命中弱口令字典，默认 true（§5.6 行 1284）。
  optional bool pwd_disallow_common = 5;
  // —— 账号策略（§5.6 行 1294-1298）——
  // 是否开放自助重置密码，默认 true；false 时 §2.4 一律 status=reset_disabled（§5.6 行 1298）。
  optional bool allow_password_reset = 6;
  // —— 验证码限流（§5.6 行 1300-1308）——
  // 同目标重发冷却（秒），默认 60（§5.6 行 1304）。
  optional int64 otp_resend_interval = 7;
  // 验证码有效期（秒），默认 300（§5.6 行 1305）。
  optional int64 otp_ttl = 8;
  // 单条验证码最大校验失败次数，超限即作废，默认 5（§5.6 行 1306）。
  optional int64 otp_max_attempts = 9;
  // 单目标每日发送上限（次），默认 10（§5.6 行 1307）。
  optional int64 otp_daily_limit_target = 10;
  // 单 IP 每日发送上限（次），默认 50（§5.6 行 1308）。
  optional int64 otp_daily_limit_ip = 11;
  // —— 其余设置项（§5.6 行 1310-1337）——
  // 已启用的登录方式（因子名 / thirdparty），只控登录，默认全开（§5.6 行 1314）。
  // has 位：true = login_methods 在场（空数组 = 清空）；缺省 / false = 不修改。
  optional bool has_login_methods = 12;
  repeated string login_methods = 13;
  // 注册总开关，默认 true；false 时 §2.3 一律 status=signup_disabled（§5.6 行 1315）。
  optional bool allow_registration = 14;
  // 用户名 + 密码注册入口，默认 true（§5.6 行 1316）。
  optional bool allow_signup_password = 15;
  // 手机号注册入口，默认 true（§5.6 行 1317）。
  optional bool allow_signup_phone = 16;
  // 邮箱注册入口，默认 true（§5.6 行 1318）。
  optional bool allow_signup_email = 17;
  // 两步验证总开关，默认 true；关闭后 mfa_policy.required 恒为 false（§5.6 行 1319）。
  optional bool mfa_enabled = 18;
  // 系统开放的二次因子集合（recovery_code 随 totp 生效，不单列）（§5.6 行 1320）。
  // has 位：true = mfa_methods 在场（空数组 = 清空）；缺省 / false = 不修改。
  optional bool has_mfa_methods = 19;
  repeated string mfa_methods = 20;
  // 同一账号当日密码错误达此次数后登录必须携带人机校验，默认 3（§5.6 行 1321）。
  optional int64 pwd_fail_capture = 21;
  // 累计失败达此次数后禁止密码登录，默认 6（§5.6 行 1322）。
  optional int64 pwd_fail_ban = 22;
  // 禁止密码登录时长（秒），默认 21600 即 6 小时（§5.6 行 1323）。
  optional int64 pwd_ban_ttl = 23;
  // 会话与 Cookie 有效期（秒），默认 604800 即 7 天（§5.6 行 1324）。
  optional int64 session_ttl = 24;
  // 会话 Cookie 名，默认 al_session（§5.6 行 1325）。
  optional string cookie_name = 25;
  // 多根域名同步列表，登录 / 登出时逐个同步（§5.6 行 1326、§2.9）。
  // has 位：true = sso_domains 在场（空数组 = 清空）；缺省 / false = 不修改。
  optional bool has_sso_domains = 26;
  repeated string sso_domains = 27;
  // 延迟写入队列 worker 数，默认 4（§5.6 行 1327）。
  optional int64 queue_workers = 28;
  // 队列长度（ring buffer），默认 8192（§5.6 行 1328）。
  optional int64 queue_capacity = 29;
  // 攒批条数阈值，默认 200（§5.6 行 1329）。
  optional int64 queue_batch = 30;
  // 攒批时间窗（毫秒），默认 2000（§5.6 行 1330）。
  optional int64 queue_flush_ms = 31;
  // 当前生效的 captcha Provider；空串 = 内置图形码 builtin_image（§5.6 行 1331）。
  optional string captcha_provider_key = 32;
  // 当前生效的短信 Provider（§5.6 行 1332）。
  optional string sms_provider_key = 33;
  // 当前生效的邮件 Provider（§5.6 行 1333）。
  optional string email_provider_key = 34;
  // 头像 / 渠道图标使用的 Storage Provider（§5.6 行 1334）。
  optional string avatar_storage_provider = 35;
  // 网关 Token 列表，可多个（§5.6 行 1335、§6）。
  // has 位：true = gateway_tokens 在场（空数组 = 清空）；缺省 / false = 不修改。
  optional bool has_gateway_tokens = 36;
  repeated string gateway_tokens = 37;
  // 事件日志保留天数，默认 180（§5.6 行 1336）。
  optional int64 eventlog_retention_days = 38;
  // 静态资源基址（CDN），改后需刷新页面生效（§5.6 行 1337、§8）。
  optional string static_base = 39;
  // HTTPS 部署形态声明，string 三态 true / false / auto，默认 auto（§5.6 行 1354）。
  // 非布尔单点开关——部署形态声明，驱动会话 Cookie 的 Secure / SameSite 属性
  //（§1.9 驱动口径）；部分更新语义下显式设值才写回，取值非三态 → invalid_request（行 1361）。
  optional string https_deployment = 40;
}

// SettingsResponse 是 AdminService/GetSettings 的响应（§5.6 行 1271）：
// 键集合 / 键名与 SetSettingsRequest 的 36 个数据键一致，编号按表序从 1 起
// 连续（Request 另带四个 has_* 伴生标志并据此重排编号，故两侧编号不同）；
// 标量与列表字段按 §12.9 行 1752 恒存在口径输出（零值 / 空串 / false /
// 空数组）。响应名沿用资源式命名（buf RPC_RESPONSE_STANDARD_NAME 豁免）。
message SettingsResponse {
  // —— 密码策略（§5.6 行 1276-1291）——
  // 最小长度，默认 8（§5.6 行 1280）。
  int64 pwd_min_length = 1;
  // 最大长度，默认 64（§5.6 行 1281）。
  int64 pwd_max_length = 2;
  // 须满足的字符类数（1-3），默认 3（§5.6 行 1282）。
  int64 pwd_require_classes = 3;
  // 禁止密码包含用户名，默认 true（§5.6 行 1283）。
  bool pwd_disallow_username = 4;
  // 禁止命中弱口令字典，默认 true（§5.6 行 1284）。
  bool pwd_disallow_common = 5;
  // —— 账号策略（§5.6 行 1294-1298）——
  // 是否开放自助重置密码，默认 true（§5.6 行 1298）。
  bool allow_password_reset = 6;
  // —— 验证码限流（§5.6 行 1300-1308）——
  // 同目标重发冷却（秒），默认 60（§5.6 行 1304）。
  int64 otp_resend_interval = 7;
  // 验证码有效期（秒），默认 300（§5.6 行 1305）。
  int64 otp_ttl = 8;
  // 单条验证码最大校验失败次数，超限即作废，默认 5（§5.6 行 1306）。
  int64 otp_max_attempts = 9;
  // 单目标每日发送上限（次），默认 10（§5.6 行 1307）。
  int64 otp_daily_limit_target = 10;
  // 单 IP 每日发送上限（次），默认 50（§5.6 行 1308）。
  int64 otp_daily_limit_ip = 11;
  // —— 其余设置项（§5.6 行 1310-1337）——
  // 已启用的登录方式，默认 ["password","otp_sms","otp_email","webauthn","thirdparty"]（§5.6 行 1314）。
  repeated string login_methods = 12;
  // 注册总开关，默认 true（§5.6 行 1315）。
  bool allow_registration = 13;
  // 用户名 + 密码注册入口，默认 true（§5.6 行 1316）。
  bool allow_signup_password = 14;
  // 手机号注册入口，默认 true（§5.6 行 1317）。
  bool allow_signup_phone = 15;
  // 邮箱注册入口，默认 true（§5.6 行 1318）。
  bool allow_signup_email = 16;
  // 两步验证总开关，默认 true（§5.6 行 1319）。
  bool mfa_enabled = 17;
  // 系统开放的二次因子集合，默认 ["totp","otp_sms","otp_email","webauthn"]（§5.6 行 1320）。
  repeated string mfa_methods = 18;
  // 密码错误人机校验阈值，默认 3（§5.6 行 1321）。
  int64 pwd_fail_capture = 19;
  // 密码登录禁止阈值，默认 6（§5.6 行 1322）。
  int64 pwd_fail_ban = 20;
  // 禁止密码登录时长（秒），默认 21600（§5.6 行 1323）。
  int64 pwd_ban_ttl = 21;
  // 会话与 Cookie 有效期（秒），默认 604800（§5.6 行 1324）。
  int64 session_ttl = 22;
  // 会话 Cookie 名，默认 al_session（§5.6 行 1325）。
  string cookie_name = 23;
  // 多根域名同步列表，默认 []（§5.6 行 1326）。
  repeated string sso_domains = 24;
  // 延迟写入队列 worker 数，默认 4（§5.6 行 1327）。
  int64 queue_workers = 25;
  // 队列长度（ring buffer），默认 8192（§5.6 行 1328）。
  int64 queue_capacity = 26;
  // 攒批条数阈值，默认 200（§5.6 行 1329）。
  int64 queue_batch = 27;
  // 攒批时间窗（毫秒），默认 2000（§5.6 行 1330）。
  int64 queue_flush_ms = 28;
  // 当前生效的 captcha Provider，默认空串（§5.6 行 1331）。
  string captcha_provider_key = 29;
  // 当前生效的短信 Provider，默认空串（§5.6 行 1332）。
  string sms_provider_key = 30;
  // 当前生效的邮件 Provider，默认空串（§5.6 行 1333）。
  string email_provider_key = 31;
  // 头像 / 渠道图标使用的 Storage Provider，默认空串（§5.6 行 1334）。
  string avatar_storage_provider = 32;
  // 网关 Token 列表，默认 []（§5.6 行 1335）。
  repeated string gateway_tokens = 33;
  // 事件日志保留天数，默认 180（§5.6 行 1336）。
  int64 eventlog_retention_days = 34;
  // 静态资源基址（CDN），默认 /assets（§5.6 行 1337）。
  string static_base = 35;
  // HTTPS 部署形态声明，string 三态 true / false / auto，默认 auto（§5.6 行 1354）。
  // 非布尔单点开关——部署形态声明，驱动会话 Cookie 的 Secure / SameSite 属性
  //（§1.9 驱动口径）。
  string https_deployment = 36;
}
