syntax = "proto3";

package api.account;

// 成功应答复用同域 profile.proto 的 OkResponse（§3.2 行 794、§3.4 行 842-847、§10.9 行 1556），
// 由 handler 返回，无需在本文件声明字段，故不 import —— 避免 buf lint 的 unused import。
// 人机校验提交格式 CaptchaPayload 在 api.sso.v1 login 单一定义（§2.5）；
// 本文件只跨包引用、不复制同构消息（§12.9 行 1748 单一结构源）。
// （包名升级：api.sso → api.sso.v1，import 与符号随迁，account 域 Connect 化另行处理。）
import "api/sso/v1/login.proto";

// Go 包名沿用 api.common / api.sso 的写法：
// 目录 api/account 对应包名 api.account（docs/接口文档.md §12.9 行 1721「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/account;api";

// ChangePasswordRequest 是 POST /api/account/password 的请求（§3.3 行 829-836）。
// 文档未定义成功响应体（只规定成功后的会话与令牌失效语义，行 836），故不定义 ChangePasswordResponse。
message ChangePasswordRequest {
  // 已设置密码时必填（§3.3 行 833）。
  string current_password = 1;
  // 须满足密码策略（§3.3 行 834、§5.6）。
  string new_password = 2;
}

// PhoneBindPayload 是 POST /api/account/phone/bind 的 payload 字段（§3.4 行 842-847、§10.9 行 1556-1557）：
// challenge 用 {phone, captcha}，verify 用 {phone, code}，同一端点按 step 取用其中一部分。
message PhoneBindPayload {
  // 目标手机号；verify 回传与 challenge 相同的 target（§3.4 行 845、行 855）。
  string phone = 1;
  // 人机校验提交，跨包引用 api.sso.v1.CaptchaPayload（§2.5 行 475-484）；challenge 必填（§3.4 行 844、§2.5 行 506）。
  api.sso.v1.CaptchaPayload captcha = 2;
  // verify：purpose=bind 的验证码（§3.4 行 845、行 854）。
  string code = 3;
}

// PhoneBindRequest 是 POST /api/account/phone/bind 的请求（§3.4 行 842-847、§10.9 行 1556-1557）：
// 两步同端点，由 step 区分；成功返回 OkResponse（challenge 见行 1556，verify 同形态）。
message PhoneBindRequest {
  // 取值 challenge｜verify（§3.4 行 844-845）；跨版本可新增，用 string 承载（§12.9 行 1726）。
  string step = 1;
  // 该步骤用到的字段（§3.4 行 844-845）。
  PhoneBindPayload payload = 2;
}

// EmailBindPayload 是 POST /api/account/email/bind 的 payload 字段（§3.4 行 842-847、§10.9 行 1556-1557）。
message EmailBindPayload {
  // 目标邮箱；verify 回传与 challenge 相同的 target（§3.4 行 847、行 855）。
  string email = 1;
  // 人机校验提交，跨包引用 api.sso.v1.CaptchaPayload（§2.5 行 475-484）；challenge 必填（§3.4 行 846、§2.5 行 506）。
  api.sso.v1.CaptchaPayload captcha = 2;
  // verify：purpose=bind 的验证码（§3.4 行 847、行 854）。
  string code = 3;
}

// EmailBindRequest 是 POST /api/account/email/bind 的请求（§3.4 行 842-847、§10.9 行 1556-1557）：
// 两步同端点，由 step 区分；成功返回 OkResponse（challenge 见行 1556，verify 同形态）。
message EmailBindRequest {
  // 取值 challenge｜verify（§3.4 行 846-847）；跨版本可新增，用 string 承载（§12.9 行 1726）。
  string step = 1;
  // 该步骤用到的字段（§3.4 行 846-847）。
  EmailBindPayload payload = 2;
}
