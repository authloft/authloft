syntax = "proto3";

package api.account;

import "google/protobuf/struct.proto";

// Go 包名沿用 api.common / api.sso 的写法：
// 目录 api/account 对应包名 api.account（docs/接口文档.md §12.9 行 1721「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/account;api";

// UserProfile 是 §3.1 行 767-771 的嵌套 profile 结构（对应 user_profile 表）：
// 既作 GET /api/account/profile 响应的 profile 字段，也作 POST /api/account/profile 请求的
// profile 载荷（§3.2 行 794）；字段名与 JSON 示例逐字一致，编号从 1 起连续（§12.9 行 1723）。
message UserProfile {
  // 性别（§3.1 行 768）。
  int64 gender = 1;
  // 生日，YYYY-MM-DD（§3.1 行 768）。
  string birthday = 2;
  // 语言区域，如 zh-CN（§3.1 行 769）。
  string locale = 3;
  // 时区，如 Asia/Shanghai（§3.1 行 769）。
  string timezone = 4;
  // user_profile.extra 为 msgpack 透传字段，接口以 JSON 对象透出（§3.1 行 770、§12.0 行 1602）。
  google.protobuf.Struct extra = 5;
}

// ProfileResponse 是 GET /api/account/profile 的响应，即 §3.1 行 751-773 的统一用户信息结构；
// OIDC get_user_info 与 RPC account/{uid}/profile 共用同一消息（《后端架构》§14 行 1536、§17 行 1639）。
// 字段名与 JSON 示例逐字一致，编号从 1 起连续；整型一律 int64（§12.9 行 1723-1724）。
// phone / email 的掩码在服务端完成（§3.1 行 775-786），响应不区分调用方。
message ProfileResponse {
  // 用户 ID（§3.1 行 753）。
  int64 id = 1;
  // 登录名，只读（§3.1 行 754、§3.2 行 793）。
  string username = 2;
  // 昵称（§3.1 行 755）。
  string nickname = 3;
  // 头像地址（§3.1 行 756）。
  string avatar_url = 4;
  // 手机号，自助接口返回掩码（§3.1 行 757、行 779）。
  string phone = 5;
  // 手机号是否已验证，JSON 示例为 1/0（§3.1 行 758）。
  int64 phone_verified = 6;
  // 邮箱，自助接口返回掩码（§3.1 行 759、行 779）。
  string email = 7;
  // 邮箱是否已验证，JSON 示例为 1/0（§3.1 行 760）。
  int64 email_verified = 8;
  // 账号状态：1 正常 0 禁用（§3.1 行 761）。
  int64 status = 9;
  // 系统强制启用两步验证（§3.1 行 762）。
  int64 mfa_required = 10;
  // 安全版本号，便于调用方感知会话失效（§3.1 行 763）。
  int64 epoch = 11;
  // 最后登录时间，Unix 秒（§3.1 行 764）。
  int64 last_login_at = 12;
  // 创建时间，Unix 秒（§3.1 行 765）。
  int64 created_at = 13;
  // 更新时间，Unix 秒（§3.1 行 766）。
  int64 updated_at = 14;
  // user_profile 表结构（§3.1 行 767-771）。
  UserProfile profile = 15;
}

// UpdateProfileRequest 是 POST /api/account/profile 的请求（§3.2 行 794）：
// {nickname?, avatar_url?, profile:{gender?,birthday?,locale?,timezone?,extra?}}；
// 用户名 / 手机号 / 邮箱不可由此修改（行 794）。文档未给出独立响应结构，成功返回 OkResponse。
message UpdateProfileRequest {
  // 昵称，可选（§3.2 行 794）。
  string nickname = 1;
  // 头像地址，可选（§3.2 行 794）。
  string avatar_url = 2;
  // 用户资料，可选（§3.2 行 794，字段见 §3.1 行 767-771）。
  UserProfile profile = 3;
}

// OkResponse 是仅返回 {ok:true} 的 account 写接口共用应答
// （POST /api/account/profile §3.2 行 794；手机号 / 邮箱绑定 §3.4 行 842-847、§10.9 行 1556）。
// 同一结构只定义一次（§12.9 行 1722），各端点复用；「复用消息 vs 单端点 XxxResponse」的张力
// 按既有约定取向复用，不另建单端点响应。
message OkResponse {
  bool ok = 1;
}

// AvatarUploadConfig 是 GET /api/account/config 的 avatar_upload（§3.2 行 792、§10.8 行 1544）：
// 供前端在 proxy / direct 间切换；local 存储配置 direct 时服务端回退 proxy（§3.2 行 799、§15.1 行 1563）。
message AvatarUploadConfig {
  // 上传模式：proxy｜direct（§3.2 行 792、§10.8 行 1546-1549）。
  string mode = 1;
  // 单文件上限（字节），默认 2MB（§3.2 行 792、行 825）。
  int64 max_size = 2;
  // 允许的 MIME 白名单（§3.2 行 792、行 825）。
  repeated string allowed_types = 3;
}

// MfaPolicyMethod 是 mfa_policy.methods 的单个二次因子投影（§3.2 行 808-813）。
message MfaPolicyMethod {
  // 二次因子，取值见 §1.10（totp｜otp_sms｜otp_email｜webauthn｜recovery_code）（§3.2 行 809-813）。
  string factor = 1;
  // 该因子是否被纳入当前用户的两步验证（§3.2 行 819）。
  bool enabled = 2;
  // 是否已绑定该因子（§3.2 行 819）。
  bool bound = 3;
}

// MfaPolicy 是 GET /api/account/config 的 mfa_policy 摘要（§3.2 行 801-821）：
// 只出摘要，不返回绑定明细 / 凭据数量 / 恢复码剩余（行 821）。
message MfaPolicy {
  // 当前用户是否已开启两步验证（§3.2 行 805）。
  bool enabled = 1;
  // 策略层是否强制；true 时用户不可关闭（§3.2 行 806）。
  bool required = 2;
  // 预留字段，本期恒为 0（§3.2 行 807、行 820）。
  int64 trusted_device_days = 3;
  // 系统开放的全部二次因子，顺序即前端渲染顺序（§3.2 行 808-818）。
  repeated MfaPolicyMethod methods = 4;
}

// CaptchaConfig 是 §2.5 行 452-462 的 captcha 配置对象：注入快照、GET /api/account/config
// 与 captcha_required / captcha_invalid 响应三处同结构同字段名。
// 它是公开配置视图（不含凭证），与提交格式 api.sso.CaptchaPayload（§2.5 行 475-484）字段不同，
// 故不能复用 CaptchaPayload；captcha 提交格式仍跨包引用 api.sso.CaptchaPayload，不复制。
message CaptchaConfig {
  // 当前生效的 captcha Provider；内置自绘回退固定为 builtin_image（§2.5 行 460）。
  string provider_key = 1;
  // 渲染类型：image｜turnstile｜recaptcha｜hcaptcha（§2.5 行 461）。
  string type = 2;
  // 第三方站点 key；type=image 时为空串（§2.5 行 462）。
  string site_key = 3;
}

// AccountConfigResponse 是 GET /api/account/config 的响应（§3.2 行 792、§10.8 行 1544）。
message AccountConfigResponse {
  // 头像上传配置（§3.2 行 792）。
  AvatarUploadConfig avatar_upload = 1;
  // 两步验证摘要（§3.2 行 792、行 801-821）。
  MfaPolicy mfa_policy = 2;
  // account entry 的 captcha 配置读取处（§3.2 行 792、§2.5 行 452-462）。
  CaptchaConfig captcha = 3;
  // 当前用户是否存在 kind=password 且 is_enabled=1 的凭证（§3.2 行 792）。
  bool has_password = 4;
}

// AvatarResponse 是 POST /api/account/avatar（proxy 模式）与 POST /api/account/avatar/commit
// 的共用响应 {url}（§3.2 行 795、行 797；§10.8 行 1546、行 1549）；同一结构只定义一次（§12.9 行 1722）。
message AvatarResponse {
  // 头像地址（§3.2 行 795、行 797）。
  string url = 1;
}

// AvatarPresignRequest 是 POST /api/account/avatar/presign 的请求（§3.2 行 796、§10.8 行 1547）。
message AvatarPresignRequest {
  // 原始文件名（§3.2 行 796）。
  string filename = 1;
  // 文件 MIME 类型，须在 allowed_types 内（§3.2 行 796、行 825）。
  string content_type = 2;
  // 文件大小，须 ≤ max_size（§3.2 行 796、行 825）。
  int64 size = 3;
}

// AvatarPresignResponse 是 POST /api/account/avatar/presign 的响应（§3.2 行 796、§10.8 行 1547）：
// key 由服务端生成，前端无法覆盖（§3.2 行 796）。
message AvatarPresignResponse {
  // 服务端生成的对象 key（§3.2 行 796）。
  string key = 1;
  // 有时效的 PUT 预签名 URL（《后端架构》§15.1 行 1553-1554、行 1569）。
  string upload_url = 2;
  // 直传时需携带的请求头，如 Content-Type（§3.2 行 796、§15.1 行 1554）。
  map<string, string> headers = 3;
  // 预签名有效期（秒），即 presign_ttl（§3.2 行 796、§15.1 行 1569）。
  int64 expires_in = 4;
}

// AvatarCommitRequest 是 POST /api/account/avatar/commit 的请求（§3.2 行 797、§10.8 行 1549）：
// 仅记录已上传，不回读校验（§3.2 行 797、行 825）。
message AvatarCommitRequest {
  // presign 阶段下发的对象 key（§3.2 行 797）。
  string key = 1;
}
