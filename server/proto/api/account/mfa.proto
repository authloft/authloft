syntax = "proto3";

package api.account;

// Go 包名沿用 api.common / api.sso 的写法：
// 目录 api/account 对应包名 api.account（docs/接口文档.md §12.9 行 1721「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/account;api";

// MfaFactor 是 GET /api/account/mfa 响应中单个二次因子的绑定明细（§3.5 行 864-869）；
// 不同 factor 只填各自相关字段，零值表示该因子不适用 / 未绑定。
message MfaFactor {
  // 二次因子，取值见 §1.10（totp｜otp_sms｜otp_email｜webauthn｜recovery_code）（§3.5 行 865-869）。
  string factor = 1;
  // 是否已绑定（§3.5 行 865-869）。
  bool bound = 2;
  // 绑定时间，Unix 秒；totp 示例（§3.5 行 865）。
  int64 bound_at = 3;
  // 最近使用时间，Unix 秒（§3.5 行 865-868）。
  int64 last_used_at = 4;
  // otp_sms / otp_email 的掩码目标（§3.5 行 866-867）。
  string target = 5;
  // webauthn 凭据数量（§3.5 行 868）。
  int64 credentials = 6;
  // recovery_code 剩余数量（§3.5 行 869）。
  int64 remaining = 7;
}

// MfaResponse 是 GET /api/account/mfa 的响应（§3.5 行 861-872）：只出绑定明细；
// 摘要（开关 / 策略强制 / trusted_device_days / 因子 enabled 与 bound）走 §3.2 mfa_policy，不在此重复（行 859）。
message MfaResponse {
  // 各因子的绑定明细（§3.5 行 864-869）。
  repeated MfaFactor factors = 1;
  // 恢复码签发时间，Unix 秒；未签发为 0（§3.5 行 871）。
  int64 recovery_issued_at = 2;
}

// UpdateMfaRequest 是 POST /api/account/mfa 的请求（§3.5 行 878）：
// 勾选启用一项或多项；空数组 = 关闭（受 §3.2 mfa_policy.required 约束）。
// 文档未定义响应体，故不定义 UpdateMfaResponse。
message UpdateMfaRequest {
  // 要启用的二次因子集合（§3.5 行 878）。
  repeated string methods = 1;
}

// TotpRequest 是 POST /api/account/mfa/totp 的请求（§3.5 行 879-880）：
// step=challenge 时为空串，step=verify 时带 secret 与 code。
message TotpRequest {
  // 取值 challenge｜verify（§3.5 行 879-880）；跨版本可新增，用 string 承载（§12.9 行 1726）。
  string step = 1;
  // verify：challenge 下发的密钥（§3.5 行 880）。
  string secret = 2;
  // verify：TOTP 码（§3.5 行 880）。
  string code = 3;
}

// TotpChallengeResponse 是 POST /api/account/mfa/totp（step=challenge）的响应（§3.5 行 879）。
message TotpChallengeResponse {
  // TOTP 密钥（§3.5 行 879）。
  string secret = 1;
  // otpauth:// 地址（§3.5 行 879）。
  string otpauth_url = 2;
  // 二维码内容，前端绘制（§3.5 行 879）。
  string qrcode_content = 3;
}

// TotpVerifyResponse 是 POST /api/account/mfa/totp（step=verify）的响应（§3.5 行 880）：
// 验证一次后生效，同一响应下发 10 个恢复码（一次性展示）。
message TotpVerifyResponse {
  bool ok = 1;
  // 10 个恢复码，与 GET /api/account/mfa/recovery 同格式（§3.5 行 880）。
  repeated string recovery_codes = 2;
}

// RecoveryCodesResponse 是 GET /api/account/mfa/recovery 的响应（§3.5 行 881），一次性展示。
message RecoveryCodesResponse {
  // 恢复码列表，格式 xxxx-xxxx（§3.5 行 881）。
  repeated string codes = 1;
  // 签发时间，Unix 秒（§3.5 行 881）。
  int64 created_at = 2;
}

// RegenerateRecoveryRequest 是 POST /api/account/mfa/recovery 的请求（§3.5 行 882）：
// 重新生成即全量作废；文档未定义响应体，故不定义 RegenerateRecoveryResponse。
message RegenerateRecoveryRequest {
  // 取值 regenerate（§3.5 行 882）。
  string action = 1;
}
