syntax = "proto3";

package api.account.v1;

// 包名 api.account.v1（docs/接口文档.md §12.9「包名 api.<域>.v1」）
// 目录 api/account/v1 与包名逐段一致。Go 产物：authloft/gen/go/api/account/v1（accountv1）。
// 本文件承载 §3.10「ConsentApprove / ConsentDeny（OIDC 授权同意）」的方法消息，
// 两方法挂在 account.proto 的 AccountService 上（本文件只定义消息，同包其余
// 消息文件同口径）。授权同意是 Authloft 页面调自身后端的内部 Connect RPC，
// 不是给外部 RP 的 OIDC 协议端点，不新增任何 /api/oidc/** 端点（§3.10）。
option go_package = "authloft/gen/go/api/account/v1;accountv1";

// ConsentApproveRequest 是 AccountService/ConsentApprove 的请求（§3.10）：
// 形态 B 授权页的七个授权参数（§4.2 注入原样回传）+ 勾选子集，字段取自注入值、
// 不新增字段。鉴权为用户会话（al_session），主体取会话 uid，不接受入参 uid。
message ConsentApproveRequest {
  // OIDC 客户端标识（§3.10；须存在且启用，服务端校验）。
  string client_id = 1;
  // 回调地址（§3.10；须命中该客户端白名单，防开放重定向）。
  string redirect_uri = 2;
  // 请求 scope 原文（§3.10：即 §4.2 注入的缺省补值后有效 scope）。
  string scope = 3;
  // 用户勾选的 scope 子集，空格分隔（§3.10；须 ⊆ scope 且必含 openid）。
  string selected_scope = 4;
  // 授权请求的 state 透传值，签码后原样拼回落点（§3.10）。
  string state = 5;
  // 授权请求的 nonce 透传值（§3.10）。
  string nonce = 6;
  // PKCE code_challenge 透传值（§3.10）。
  string code_challenge = 7;
  // PKCE code_challenge_method 透传值（§3.10）。
  string code_challenge_method = 8;
}

// ConsentDenyRequest 是 AccountService/ConsentDeny 的请求（§3.10）：拒绝不写
// 授权记录，服务端校验 client_id / redirect_uri 白名单后拼 error=access_denied
// 落点返回。
message ConsentDenyRequest {
  // OIDC 客户端标识（§3.10）。
  string client_id = 1;
  // 回调地址（§3.10；须命中该客户端白名单，防开放重定向）。
  string redirect_uri = 2;
  // 授权请求的 state 透传值，原样拼回落点（§3.10）。
  string state = 3;
}

// ConsentResponse 是 ConsentApprove / ConsentDeny 共用的响应（§3.10）：
// 本 RPC 返回落点消息、不做 302，前端按 §1.3 终点顺序跳转（与登录流程
// 「RPC 返回落点、前端跳」同构）。
message ConsentResponse {
  // 落点：approve 为 redirect_uri?code=…&state=…；deny 为
  // redirect_uri?error=access_denied&state=…（§3.10）。
  string redirect_to = 1;
  // 多域名同步首跳，sso_domains 为空时省略（§2.9、§3.10）。
  string sync_cookie_url = 2;
}
