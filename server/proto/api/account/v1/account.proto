syntax = "proto3";

package api.account.v1;

// AccountService 的方法 input/output 消息定义在同包各消息文件中，本文件只定义 service
//（docs/接口文档.md §12.9「每域一个 service，名为 <域>Service」）；
// 方法清单 = 接口文档 §3 全部端点。
import "api/account/v1/profile.proto";
import "api/account/v1/security.proto";
import "api/account/v1/mfa.proto";
import "api/account/v1/webauthn.proto";
import "api/account/v1/thirdparty.proto";
// 授权同意两方法的消息单一结构源（§3.10）。
import "api/account/v1/consent.proto";
// 敏感操作二次验证的四组消息单一结构源在 api.common.v1，方法挂本域
// 与 SsoService，不新建业务域（§3.8、§12.9）。
import "api/common/v1/verification.proto";
// GetThirdpartyTicket 的响应复用登录流程信封（§1.3 把 ticket / bind 字段的
// 出现场景明列为 AccountService/GetThirdpartyTicket；§3.7.1 B 的响应形状
// 即其子集），跨包引用 api.sso.v1.LoginFlowResponse（§12.9 单一结构源）。
import "api/sso/v1/envelope.proto";

// 包名 api.account.v1（docs/接口文档.md §12.9「包名 api.<域>.v1」）；
// Go 产物 authloft/gen/go/api/account/v1（accountv1）
// connect 产物（protoc-gen-connect-go）随 service 定义生成。
option go_package = "authloft/gen/go/api/account/v1;accountv1";

// GetMyPermissionsRequest 无字段：主体固定取会话 uid，不接受入参 uid 以免
// 越权查他人权限（§3.9）。Connect unary 须有请求消息，空消息承载。
message GetMyPermissionsRequest {}

// GetMyPermissionsResponse 当前用户的全部权限点；无任何权限点时为空列表
//（标准 protojson 省略空 repeated，调用方按「零值或缺失即空列表」处理，§3.9）。
message GetMyPermissionsResponse {
  repeated string permissions = 1;
}

// AccountService 是 account 域的 Connect service。
// Connect 路径 = /api.account.v1.AccountService/<Method>；方法清单与 §3 各节逐一对应：
//   GetConfig                  §3.2    GetProfile               §3.2
//   UpdateProfile              §3.2    PresignAvatar            §3.2
//   CommitAvatar               §3.2    UploadAvatar             §3.2
//   ChangePassword             §3.3    BindPhone                §3.4
//   BindEmail                  §3.4    GetMfa                   §3.5
//   SetMfa                     §3.5    BindTotp                 §3.5
//   UnbindTotp                 §3.5    RegenerateRecoveryCodes  §3.5
//   GetWebauthnCredentials     §3.6    RegisterWebauthn         §3.6
//   RenameWebauthnCredential   §3.6    DeleteWebauthnCredential §3.6
//   GetThirdpartyBindings      §3.7    UnbindThirdparty         §3.7
//   ThirdpartyOauth            §3.7.1 A  GetThirdpartyTicket    §3.7
//   GetEvents                  §3.7    StartVerification        §3.8
//   SubmitVerification         §3.8    GetMyPermissions         §3.9
//   ConsentApprove             §3.10   ConsentDeny              §3.10
// 头像 proxy 上传经 UploadAvatar 一次 bytes 直传（§3.2 / §10.8），
// 不再走 REST 豁免端点。
// 空响应方法共用同包 OkResponse（空消息，§1.0 成功响应即消息本身）
// 故无 XxxResponse 命名（buf 的 RPC_RESPONSE_STANDARD_NAME / RPC_REQUEST_RESPONSE_UNIQUE
// 与共用响应口径冲突，按「文档优先」在 buf.yaml except 豁免）。
service AccountService {
  // 头像上传配置 / MFA 摘要 / captcha 配置 / hasPassword（§3.2）。
  rpc GetConfig(GetConfigRequest) returns (AccountConfigResponse);
  // §3.1 统一用户信息结构（§3.2）。
  rpc GetProfile(GetProfileRequest) returns (ProfileResponse);
  // 修改资料，成功为空响应（§3.2）。
  rpc UpdateProfile(UpdateProfileRequest) returns (OkResponse);
  // direct 模式取预签名（§3.2）。
  rpc PresignAvatar(PresignAvatarRequest) returns (AvatarPresignResponse);
  // direct 模式确认上传，仅记录不回读（§3.2）。
  rpc CommitAvatar(CommitAvatarRequest) returns (AvatarResponse);
  // proxy 模式上传：文件内容一次 bytes 直传，服务端校验 MIME / 大小后
  // 落盘（§3.2、§10.8）。
  rpc UploadAvatar(UploadAvatarRequest) returns (AvatarResponse);
  // 改密，成功为空响应并递增 epoch（§3.3）。
  rpc ChangePassword(ChangePasswordRequest) returns (OkResponse);
  // 手机号绑定 / 换绑两步，由 step 区分（§3.4），成功为空响应。
  rpc BindPhone(BindPhoneRequest) returns (OkResponse);
  // 邮箱绑定 / 换绑两步，由 step 区分（§3.4），成功为空响应。
  rpc BindEmail(BindEmailRequest) returns (OkResponse);
  // MFA 绑定明细（§3.5）。
  rpc GetMfa(GetMfaRequest) returns (MfaResponse);
  // 勾选启用因子集合，成功为空响应（§3.5）。
  rpc SetMfa(SetMfaRequest) returns (OkResponse);
  // TOTP 绑定两步，由 step 区分（§3.5）。
  rpc BindTotp(BindTotpRequest) returns (BindTotpResponse);
  // 解除当前 TOTP 绑定，成功为空响应（§3.5）。前置：须先经 §3.8
  // 取得 verificationToken（biz_purpose=unbind_totp），由本请求携带。
  rpc UnbindTotp(UnbindTotpRequest) returns (OkResponse);
  // 重新生成即全量作废，同格式下发新码（§3.5）。
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RecoveryCodesResponse);
  // 已绑定凭据列表（§3.6）。
  rpc GetWebauthnCredentials(GetWebauthnCredentialsRequest) returns (WebauthnListResponse);
  // 注册两步，由 step 区分；challenge 要求 resident key（§3.6）。
  rpc RegisterWebauthn(RegisterWebauthnRequest) returns (RegisterWebauthnResponse);
  // 凭据重命名，成功为空响应（§3.6）。
  rpc RenameWebauthnCredential(RenameWebauthnCredentialRequest) returns (OkResponse);
  // 凭据删除，成功为空响应（§3.6）。
  rpc DeleteWebauthnCredential(DeleteWebauthnCredentialRequest) returns (OkResponse);
  // 已绑定与可绑定的第三方列表（§3.7）。
  rpc GetThirdpartyBindings(GetThirdpartyBindingsRequest) returns (ThirdpartyBindingsResponse);
  // 解绑，成功为空响应（§3.7）。
  rpc UnbindThirdparty(UnbindThirdpartyRequest) returns (OkResponse);
  // channel=redirect 的绑定回调落地（§3.7、§3.7.1 A）。
  rpc ThirdpartyOauth(ThirdpartyOauthRequest) returns (ThirdpartyOauthResponse);
  // channel=qrcode 的绑定长轮询（§3.7、§3.7.1 B）
  // 响应复用登录流程信封（§1.3）。
  rpc GetThirdpartyTicket(GetThirdpartyTicketRequest) returns (api.sso.v1.LoginFlowResponse);
  // 本人登录记录（仅成功记录，§3.7）。
  rpc GetEvents(GetEventsRequest) returns (GetEventsResponse);
  // 已登录会话域取得挑战令牌与可用因子（§3.8.1、§3.8.2）。
  rpc StartVerification(api.common.v1.StartVerificationRequest) returns (api.common.v1.StartVerificationResponse);
  // 提交二次因子，返回不透明断言令牌交回敏感操作（§3.8.1、§3.8.2）。
  rpc SubmitVerification(api.common.v1.SubmitVerificationRequest) returns (api.common.v1.SubmitVerificationResponse);
  // 当前登录用户的全部权限点；普通用户亦可达、不要求任何权限点（§3.9）。
  rpc GetMyPermissions(GetMyPermissionsRequest) returns (GetMyPermissionsResponse);
  // OIDC 授权页形态 B 同意提交：写授权记录并签码，返回落点消息、不做 302
  //（§3.10，跳转归前端 §1.3 终点处理）。
  rpc ConsentApprove(ConsentApproveRequest) returns (ConsentResponse);
  // OIDC 授权页形态 B 同意拒绝：不写授权记录，拼 access_denied 落点返回（§3.10）。
  rpc ConsentDeny(ConsentDenyRequest) returns (ConsentResponse);
}
