syntax = "proto3";

package api.account.v1;

// GetEvents 条目的 detail 为 msgpack 透传字段的 JSON 视图（§3.7）
// 与 admin 域 EventItem.detail 同口径（先例：user_profile.extra）。
import "google/protobuf/struct.proto";

// 包名 api.account.v1（docs/接口文档.md §12.9「包名 api.<域>.v1」）
// 目录 api/account/v1 与包名逐段一致。Go 产物：authloft/gen/go/api/account/v1（accountv1）。
// 本文件承载 §3.7「第三方绑定与日志」的方法消息（历史上未落地，随 Connect 化
// 按 §3.7 定稿补齐）；GetThirdpartyTicket 的响应复用 api.sso.v1.LoginFlowResponse
//（§1.3 字段说明把 ticket / bind 的出现场景明列为
// AccountService/GetThirdpartyTicket），在 account.proto 的 service 定义中引用，
// 本文件不 import（避免 buf lint 的 unused import）。
option go_package = "authloft/gen/go/api/account/v1;accountv1";

// GetThirdpartyBindingsRequest 是 AccountService/GetThirdpartyBindings 的请求
//（§3.7，无入参）。
message GetThirdpartyBindingsRequest {}

// ThirdpartyBinding 是 GetThirdpartyBindings 响应的已绑定条目（§3.7）：
// {providerKey, displayName, type, channel, icon, createdAt}。
message ThirdpartyBinding {
  // 第三方渠道标识（§3.7）。
  string provider_key = 1;
  // 展示名（§3.7）。
  string display_name = 2;
  // 渠道类型（§3.7）。
  string type = 3;
  // 交互通道，取值与 §2.7.1 登录快照完全一致：redirect｜qrcode｜api（§3.7、）；
  // 跨版本可新增，用 string 承载（§12.9）。
  string channel = 4;
  // 图标地址（§3.7）。
  string icon = 5;
  // 绑定时间，Unix 秒（§3.7）。
  int64 created_at = 6;
}

// ThirdpartyOption 是 GetThirdpartyBindings 响应的可绑定条目（§3.7）：
// {providerKey, displayName, type, channel, icon, sortOrder}；
// 过滤条件：is_enabled=1 且 enable_signin=1、排除已绑定、Union Provider 不出现。
message ThirdpartyOption {
  // 第三方渠道标识（§3.7）。
  string provider_key = 1;
  // 展示名（§3.7）。
  string display_name = 2;
  // 渠道类型（§3.7）。
  string type = 3;
  // 交互通道，取值同 ThirdpartyBinding.channel（§3.7）。
  string channel = 4;
  // 图标地址（§3.7）。
  string icon = 5;
  // 排序（§3.7）。
  int64 sort_order = 6;
}

// ThirdpartyBindingsResponse 是 AccountService/GetThirdpartyBindings 的响应
//（§3.7）：items = 已绑定，available = 可绑定。
message ThirdpartyBindingsResponse {
  // 已绑定的第三方身份（§3.7）。
  repeated ThirdpartyBinding items = 1;
  // 可绑定的 Provider（§3.7）。
  repeated ThirdpartyOption available = 2;
}

// UnbindThirdpartyRequest 是 AccountService/UnbindThirdparty 的请求（§3.7：
// {providerKey} 解绑）。允许条件见；成功为空响应（OkResponse）。
message UnbindThirdpartyRequest {
  // 要解绑的第三方渠道标识（§3.7）。
  string provider_key = 1;
}

// ThirdpartyOauthRequest 是 AccountService/ThirdpartyOauth 的请求
//（§3.7.1 A）：channel=redirect 的三方回调落地接口（需 al_session）。
message ThirdpartyOauthRequest {
  // 第三方渠道标识（§3.7.1 A）。
  string provider_key = 1;
  // 第三方授权码（§3.7.1 A）。
  string code = 2;
  // 必须为 b 前缀，与 al_login_state Cookie 比对（§3.7.1 A）。
  string state = 3;
}

// ThirdpartyOauthResponse 是 AccountService/ThirdpartyOauth 的响应
//（§3.7.1 A）：成功 { "providerKey": "qq", "displayName": "QQ" }。
message ThirdpartyOauthResponse {
  // 绑定完成的渠道标识（§3.7.1 A）。
  string provider_key = 1;
  // Provider 展示名（§3.7.1 A）。
  string display_name = 2;
}

// GetThirdpartyTicketRequest 是 AccountService/GetThirdpartyTicket 的请求
//（§3.7.1 B）：扫码绑定的长轮询（channel=qrcode，需 al_session）。
message GetThirdpartyTicketRequest {
  // 拉码时下发的加密票据（§3.7.1 B）。
  string ticket = 1;
  // 长轮询最长等待秒数，上限见 §2.8（§3.7.1 B）；
  // 整型一律 int64，JSON 输出十进制字符串（§12.9）。
  int64 poll = 2;
}

// GetThirdpartyTicket 的响应复用 api.sso.v1.LoginFlowResponse（§1.3）：
// 顶层 status 表达轮询结论（pending / scanned / expired / success / 失败类）
// ticket 字段为 {status, ticketId}、绑定完成时 bind 字段为 {providerKey, displayName}、
// 失败结论时 error 字段承载展示信息（§3.7.1 B）；
// 零值字段 protojson 省略（§12.9）后 JSON 形状与 §3.7.1 B 示例逐字一致，
// 不另建 GetThirdpartyTicketResponse。

// GetEventsRequest 是 AccountService/GetEvents 的请求（§3.7：
// {event, page, pageSize, …}，分页见 §1.7）。查询参数缺省即不过滤，一律 optional。
message GetEventsRequest {
  // 按事件类型过滤，仅成功登录记录（§3.7）。
  optional string event = 1;
  // 页码，从 1 开始（§1.7）。
  optional int64 page = 2;
  // 每页条数，默认 20、上限 100（§1.7）。
  optional int64 page_size = 3;
  // 排序字段，取值由前端限定（§1.7）。
  optional string sort = 4;
  // 排序方向 asc/desc（§1.7）。
  optional string order = 5;
}

// UserEventItem 是 AccountService/GetEvents 的本人登录记录条目（§3.7）：
// {event, createdAt, ip, ua, amr, clientId, detail}——§12.9 的裁剪视图，
// 与 admin 域 EventItem（《后端架构》§4.6 行投影，含 actor / target 等管理视图字段）
// 非同一视图，独立定义、不跨包引用（依赖方向 admin → account 单向，避免环）。
message UserEventItem {
  // 事件类型（§3.7）；跨版本可能新增，用 string 承载（§12.9）。
  string event = 1;
  // 发生时间，Unix 秒（§3.7）。
  int64 created_at = 2;
  // 来源 IP（§3.7）。
  string ip = 3;
  // User-Agent（§3.7）。
  string ua = 4;
  // 通过的认证方法，如 pwd,otp,mfa（§3.7）。
  string amr = 5;
  // OIDC 客户端（§3.7）。
  string client_id = 6;
  // 附加信息，msgpack 透传、以 JSON 对象透出（§3.7）。
  google.protobuf.Struct detail = 7;
}

// GetEventsResponse 是 AccountService/GetEvents 的响应（§3.7、§1.7：
// {items, total, page, pageSize}）。
message GetEventsResponse {
  // 当前页数据（§1.7）。
  repeated UserEventItem items = 1;
  // 总条数（§1.7）。
  int64 total = 2;
  // 页码（§1.7）。
  int64 page = 3;
  // 每页条数（§1.7）。
  int64 page_size = 4;
}
