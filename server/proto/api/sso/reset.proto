syntax = "proto3";

package api.sso;

import "google/protobuf/struct.proto";
// 复用人机校验统一提交格式（docs/接口文档.md §2.5 行 475-484，两类 Provider 单一定义）：
// CaptchaPayload 定义在同包的 login.proto，本文件只引用不复制（§12.9 行 1722 单一结构源）。
import "api/sso/login.proto";

// Go 包名沿用 api.common / api.sso envelope 的写法：
// 目录 api/sso 对应包名 api.sso（docs/接口文档.md §12.9 行 1721「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/sso;api";

// ResetRequest 是 `POST /api/sso/reset-password` 的请求体
// （docs/接口文档.md §2.4，行 434-446）。
// 顶层与 §2.2 同构（行 436「与 2.2 同构，flow=reset」），字段名与 §2.2 字段表
// 逐字一致且 snake_case，编号从 1 起连续（§12.9 行 1723）。
// 响应复用本包 Envelope（§1.3 行 103 标题与行 105 的共用清单含 /api/sso/reset-password），
// 故不定义 ResetResponse；status=reset_disabled 等状态只体现在信封 status 上（§2.4 行 446），
// 本请求体不设重复的状态字段。
message ResetRequest {
  // 首次不带；后续必须带（内存变量回传）（§2.2 行 396，随「与 2.2 同构」引入，§2.4 行 436）。
  string login_token = 1;
  // 无 login_token 时必须带（§2.2 行 397，随同构引入，§2.4 行 436）；
  // 跨版本可新增，用 string 承载（§12.9 行 1726）。
  string method = 2;
  // 取值 challenge｜verify｜set_password（§2.4 行 440-442；§2.2 行 398 已预留 set_password）；
  // 同为跨版本可新增的取值，用 string 承载（§12.9 行 1726）。
  string step = 3;
  // 重置各 step 的字段，见 ResetPayload（§2.4 行 440-442）。
  ResetPayload payload = 4;
  // OIDC 授权上下文（§2.2 行 401，随同构引入，§2.4 行 436）：仅首次请求（尚无 login_token）
  // 时回传；前端不解析其内部字段，与 Envelope.next_step.challenge_data 同口径用
  // google.protobuf.Struct，不逐字段建模。
  google.protobuf.Struct oidc = 5;
}

// ResetPayload 是 §2.4 重置各 step 的 payload 字段合集（行 440-442）：
// 单次请求只按 step 使用其中一部分，字段名与该表 payload 列逐字一致（§12.9 行 1723）。
// 字段集合与 LoginPayload（login.proto）不同（本消息无 username/credential，另有
// set_password 的 password），且口径来源不同（本消息以 §2.4 为准），故在本文件各建：
// 按 §12.8 / §12.9 只增不改，重置后续若需新增字段直接在本文件加号，不动已验收的
// login.proto / register.proto。
message ResetPayload {
  // challenge 步：目标邮箱，须为已绑定且已验证的（§2.4 行 440）；与 phone 二选一。
  string email = 1;
  // challenge 步：目标手机号，须为已绑定且已验证的（§2.4 行 440）；与 email 二选一。
  string phone = 2;
  // 人机校验提交，结构见同包 CaptchaPayload（§2.5 行 475-484）：提交格式在 §2.5 单一定义、
  // 两类 Provider 统一，故复用不另建。challenge 步必填——重置的下发必须过 captcha
  // （§2.5 行 504「注册 / 重置的下发：必须」，行 501「每次下发都要新的」）。
  CaptchaPayload captcha = 3;
  // verify 步：验证码，purpose=reset（§2.4 行 441；6 位口径见 §2.6 行 521）。
  string code = 4;
  // set_password 步：新密码，需满足强度策略（§2.4 行 442、§5.6）。
  string password = 5;
}
