syntax = "proto3";

package api.sso;

// 报文之间只引用不复制（§12.9 行 1722 单一结构源）：
// Envelope / TicketStatus / SsoError 定义在 envelope.proto，CaptchaPayload 定义在 login.proto。
import "api/sso/envelope.proto";
import "api/sso/login.proto";

// Go 包名沿用 api.common / api.sso envelope 的写法：
// 目录 api/sso 对应包名 api.sso（docs/接口文档.md §12.9 行 1721「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/sso;api";

// QrcodeRequest 是 `POST /api/sso/qrcode` 的请求体
// （docs/接口文档.md §2.8，行 663-678）；登录与绑定共用，靠 scene 区分（行 665）。
// 字段名与行 669-677 的 JSON 示例 / 字段表逐字一致，编号从 1 起连续（§12.9 行 1723）。
message QrcodeRequest {
  // 扫码类 Provider（§2.8 行 676）。
  string provider_key = 1;
  // login（默认）｜bind（需 al_session，否则 401）（§2.8 行 677）；
  // 跨版本可能新增，用 string 承载（§12.9 行 1726）。
  string scene = 2;
  // 每次拉码都要新的，结构见 §2.5（§2.8 行 678、§2.5 行 475-484）。
  CaptchaPayload captcha = 3;
}

// QrcodeResponse 是 `POST /api/sso/qrcode` 的响应（§2.8 行 671）。
message QrcodeResponse {
  // 服务端加密的 TicketPayload，客户端不可篡改（§2.8 行 671、680、682）。
  string ticket = 1;
  // 拉码时下发的票据标识，全链路统一用这一个名字（§2.8 行 671、683）。
  string ticket_id = 2;
  // 小程序码图片地址（§2.8 行 671）。
  string qrcode_url = 3;
  // 票据有效期（秒）；整型一律 int64，JSON 输出十进制字符串（§2.8 行 671、§12.9 行 1724）。
  int64 expires_in = 4;
}

// LoginTicketResponse 是 `GET /api/sso/login/ticket` 的轮询响应
// （docs/接口文档.md §2.8，行 685-705）。
// 顶层 status / ticket / login / error 与行 694-704 的 JSON 示例逐字一致
// （ticket / login / error 为可选，见 §1.3 行 153-155），编号从 1 起连续（§12.9 行 1723）。
message LoginTicketResponse {
  // 本次轮询结论，取值 pending / scanned / expired / success / 失败类（§2.8 行 692、696-704）；
  // 跨版本可能新增，用 string 承载（§12.9 行 1726）。
  string status = 1;
  // 票据状态对象 {status, ticket_id}（§2.8 行 696-704）。
  TicketStatus ticket = 2;
  // 结果就绪（status=success）时为 §1.3 的统一信封（§2.8 行 692、700）。
  Envelope login = 3;
  // 结果已就绪但认证 / 业务失败时的展示信息（§2.8 行 704、§1.3 行 134）。
  SsoError error = 4;
}

// LoginTicketRequest 是 `POST /api/sso/login/ticket` 的写入请求
// （docs/接口文档.md §2.8，行 711-719）；由已登录一端确认授权结果。
// 字段名与行 715-719 的字段表逐字一致，编号从 1 起连续（§12.9 行 1723）。
message LoginTicketRequest {
  // 拉码时下发的 ticket_id（§2.8 行 717）。
  string ticket_id = 1;
  // 当前已登录设备的 session_token（§1.2）；缺省时取 Cookie al_session，
  // 两者同时存在时以 body 为准且必须同 uid（§2.8 行 718）。
  string session = 2;
}

// TicketStatusResponse 是已扫码上报的票据状态应答
// （`POST /api/sso/login/oauth` 的 stage=scanned，§2.7.4 行 619、624-626）。
// 它不是 §1.3 统一信封，只有顶层 status 一个字段，取值沿用 ticket.status。
message TicketStatusResponse {
  // 固定为 scanned（§2.7.4 行 619、626）；跨版本可能新增，用 string 承载（§12.9 行 1726）。
  string status = 1;
}
