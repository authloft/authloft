syntax = "proto3";

package api.sso;

import "google/protobuf/struct.proto";

// Go 包名沿用 api.common / api.sso envelope 的写法：
// 目录 api/sso 对应包名 api.sso（docs/接口文档.md §12.9 行 1721「按域分目录、包名为 api.<域>」）。
option go_package = "authloft/gen/go/api/sso;api";

// AuthorizeResponse 是 `GET /api/sso/authorize` 的响应
// （docs/接口文档.md §2.7.2，行 555-562）。
// 该接口是普通 GET（非 302），响应只有 authorize_url 一个字段（行 562）。
message AuthorizeResponse {
  // 带前缀 state 的三方授权 URL，由前端 location.replace 跳转（§2.7.2 行 562-564）。
  string authorize_url = 1;
}

// LoginOauthRequest 是 `POST /api/sso/login/oauth` 的请求体
// （docs/接口文档.md §2.7.4，行 592-604；小程序扫码提交同端点，行 617-626）。
// 字段名与 §2.7.4 字段表逐字一致且 snake_case，编号从 1 起连续（§12.9 行 1723）。
// 响应按场景复用 TicketStatus / Envelope / TicketStatusResponse（§2.7.4 行 608-615），
// 故不定义 LoginOauthResponse。
message LoginOauthRequest {
  // 必填（§2.7.4 行 598）。
  string provider_key = 1;
  // 第三方授权码 / wx.login() 的 code；stage=complete（默认）时必填，stage=scanned 时不带（§2.7.4 行 599）。
  string code = 2;
  // redirect 通道必填，与 al_login_state Cookie 比对；stage=scanned 时不带（§2.7.4 行 600）。
  string state = 3;
  // complete（默认）｜scanned（仅上报已扫码，写 ticket.status=scanned 空结果）（§2.7.4 行 601）；
  // 跨版本可能新增，用 string 承载（§12.9 行 1726）。
  string stage = 4;
  // 扫码场景：结果写入该 ticket；stage=scanned 时必填（§2.7.4 行 602）。
  string ticket_id = 5;
  // 小程序 api 通道 / 绑定中间态时回传（§2.7.4 行 603）。
  string login_token = 6;
  // OIDC 上下文，取自跳转前落 localStorage 的 __AUTHLOFT_INIT__.oidc（§2.7.2 行 575、§2.7.4 行 604）；
  // 前端不解析其内部字段，与 Envelope.next_step.challenge_data 同口径用
  // google.protobuf.Struct，不逐字段建模。
  google.protobuf.Struct oidc = 7;
}
