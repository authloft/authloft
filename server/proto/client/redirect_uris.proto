syntax = "proto3";

package client;

// 本包是存储模型（docs/接口文档.md §12 前言：client.RedirectUris 前端
// 管理后台按字段构造 / 校验，契约在接口文档 §12.3，双端不得各自手写）。裸包名
// client 不带 .v1 版本后缀，系存储模型惯例（与 token 包同构）。生成到
// gen/go/client/，Go 包名 client。
option go_package = "authloft/gen/go/client;client";

// ClientRedirectUris 是客户端回调白名单（docs/接口文档.md §12.3），
// 对应 oidc_client.redirect_uris 列（VARBINARY，§12.0：结构固定走
// Protobuf；SSO 客户端同源）。字段名 / 编号 / 类型 / 注释的
// protobuf 定义逐字一致。
message ClientRedirectUris {
  repeated string uris = 1;   // 支持 * 通配，整段匹配
}

// ClientLoginMethods 是 SSO 应用可用的登录方式集合（docs/接口文档.md §12.3、
// §5.5「SSO 应用级登录配置」），对应 sso_client.login_methods 列（VARBINARY，
// 《后端架构》§4.4；§12.0：结构固定走 Protobuf）。空 = 未配置 = 跟随全局，
// 交集判定见接口文档 §2.1。
message ClientLoginMethods {
  repeated string methods = 1;     // 封闭集：password | otp_sms | otp_email | webauthn | thirdparty
}

// ClientAuthProviders 是 SSO 应用可用的 Auth Provider key 白名单
//（docs/接口文档.md §12.3、§5.5），对应 sso_client.auth_providers 列
//（VARBINARY，《后端架构》§4.4）。thirdparty 为 Auth Provider 的整体开关，
// 明细由本集合控制。空 = 未配置 = 跟随全局。
message ClientAuthProviders {
  repeated string providers = 1;   // Auth Provider key 白名单
}
